views:
  - type: sections
    max_columns: 4
    title: Crew
    path: crew-new
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Crew Cabin - Lights
            heading_style: title
          - type: custom:mod-card
            style: |
              ha-card {
                border: 1px solid #2196f3;
                border-radius: 12px;
                box-shadow: 1px 1px 1px #888;
                font-size: 12px;
                --ha-card-header-font-size: 16px !important;
               }
            card:
              type: vertical-stack
              cards:
                - type: entities
                  entities:
                    - entity: light.crew_cabin_plafond
                      icon: mdi:wall-sconce-flat
                      secondary_info: brightness
                    - entity: light.crew_cabin_hal_en_plinten
                      icon: mdi:wall-sconce-flat
                      secondary_info: brightness
                  title: Groups
          - type: custom:mod-card
            style: |
              ha-card {
                border: 1px solid #2196f3;
                border-radius: 12px;
                box-shadow: 1px 1px 1px #888;
                font-size: 12px;
                --ha-card-header-font-size: 16px !important;
               }
            card:
              type: vertical-stack
              cards:
                - type: entities
                  entities:
                    - entity: light.cc_s_11a_bed_d6
                      icon: mdi:wall-sconce-flat
                      secondary_info: brightness
                      name: Plafond bed (2 spots)
                    - entity: light.cc_s_11a_zitje_d5
                      icon: mdi:wall-sconce-flat
                      secondary_info: brightness
                      name: Plafond zitjes (2 spots)
                    - entity: light.cc_s_11b_gang_d11
                      icon: mdi:wall-sconce-flat
                      secondary_info: brightness
                      name: Hal (2 spots)
                    - entity: light.cc_s_11a_tafel_d7
                      icon: mdi:wall-sconce-flat
                      secondary_info: brightness
                      name: Tafel (spot)
                    - type: section
                    - entity: light.cc_12a
                      icon: mdi:wall-sconce-flat
                      secondary_info: brightness
                      name: Toilet (4 spots)
                    - type: section
                    - entity: light.cc_s_11b_plint_d8
                      icon: mdi:led-strip-variant
                      secondary_info: brightness
                      name: Plinten
                    - type: section
                    - entity: light.cc_s_11b_kasten_d12
                      icon: mdi:wall-sconce-flat
                      secondary_info: brightness
                      name: Kasten ledstrip(-)
                  title: All
      - type: grid
        cards:
          - type: heading
            heading: Crew Cabin - Powersupply
            heading_style: title
          - type: custom:mod-card
            style: |
              ha-card {
                border: 1px solid #2196f3;
                border-radius: 12px;
                box-shadow: 1px 1px 1px #888;
                font-size: 12px;
                --ha-card-header-font-size: 16px !important;
               }
            card:
              type: vertical-stack
              cards:
                - type: entities
                  entities:
                    - entity: fan.cc_w_e1
                      color: blue
                    - entity: switch.cc_w_e2
                    - entity: switch.cc_w_e3
                      icon: mdi:toilet
                      name: Toilet
                      secondary_info: none
                    - entity: switch.cc_k1
                      icon: mdi:power-socket-eu
                      secondary_info: none
                      name: Wall Sockets
                    - entity: switch.0xa4c138f65edc9815
                      icon: mdi:power-plug
                      secondary_info: none
                      name: Socket Plug
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Crew Cabin - Motion & Temperature
            card_mod:
              style: >
                ha-card .title p { font-size: 16px; }

                ha-card .title ha-icon { --mdc-icon-size: 20px; }

                ha-card .subtitle p { font-size: 20px; color: black; }

                ha-card .subtitle ha-icon { --mdc-icon-size: 20px; color: black;
                }
          - type: custom:mod-card
            style: |
              ha-card {
                border: 1px solid #2196f3;
                border-radius: 12px;
                box-shadow: 1px 1px 1px #888;
                font-size: 12px;
               }
            card:
              type: vertical-stack
              cards:
                - type: history-graph
                  entities:
                    - entity: binary_sensor.motionsensorcrew_occupancy
                  hours_to_show: 1
                - type: history-graph
                  entities:
                    - entity: binary_sensor.motionsensorcrew_occupancy
                  hours_to_show: 48
                - type: entities
                  entities:
                    - binary_sensor.motionsensorcrew_occupancy
                    - sensor.motionsensorcrew_temperature
                - chart_type: line
                  period: 5minute
                  type: statistics-graph
                  entities:
                    - sensor.motionsensorcrew_temperature
                  stat_types:
                    - mean
                  days_to_show: 7
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Webasto Crew Cabin
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.webasto_bluecool_noder_crew_cabin_temp
                color: red
          - type: custom:mod-card
            style: |
              ha-card {
                border: 1px solid #2196f3;
                border-radius: 12px;
                box-shadow: 1px 1px 1px #888;
                font-size: 12px;
                --ha-card-header-font-size: 16px !important;
               }
            card:
              type: vertical-stack
              cards:
                - type: entities
                  entities:
                    - entity: switch.webasto_bluecool_noder_crew_cabin_ac
                      name: Crew Cabin
                    - entity: number.webasto_bluecool_noder_crew_cabin_fan_speed
                      name: Ventilator stand (6 = automatisch)
                    - entity: number.webasto_bluecool_noder_crew_cabin
                      name: Temperatuur
    cards: []
    background:
      opacity: 33
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
      image:
        media_content_id: media-source://image_upload/0ac019d39324cf444e0feb9794869fb3
        media_content_type: image/jpeg
        metadata:
          title: Plattegrond-flat.jpg
          thumbnail: /api/image/serve/0ac019d39324cf444e0feb9794869fb3/256x256
          media_class: image
          navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
