# Plakken in HA: Instellingen → Automatiseringen en scènes → Scripts → + Script toevoegen →
# Nieuw script maken → ⋮ (rechtsboven) → Bewerken in YAML → alles vervangen door dit bestand → Opslaan.
# De entiteit moet script.diesel_stoppen heten (volgt uit de alias; controleer na opslaan).
# Gebruikt de helper van Start Diesel (input_text.diesel_opstarten_status) en script.vaarmodus_kiezen.
# Bron: diesel_stoppen.yaml (package; daar staat ook de uitleg van de stappen en de status). Pas beide aan.

alias: Diesel stoppen
description: >-
  Loopt met de bediener het stoppen van de Volvo door: Start/Stop-knop (met controle op de sensoren), keuze
  Elektrisch, Haven, Anker of Zeilen en, alleen bij Haven of Anker, contact uit. Status in input_text.diesel_opstarten_status.
icon: mdi:engine-off
mode: single
max_exceeded: silent   # tweede start tijdens een lopende run wordt genegeerd
variables:
  status: input_text.diesel_opstarten_status
  plan: "stop,modus,contact"
  draait: binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_running
  toeren: sensor.engine_room_main_engine_me_rpm
  keuze_haven: input_select.vaarmodus_haven
  havenmodus: binary_sensor.wago_hcs_controls_wago_hcs_controls_harbor_mode
  elektrisch: binary_sensor.wago_hcs_controls_wago_hcs_controls_electric_mode
  elektrischknop: button.wago_hcs_controls_wago_controls_electricmode
  dc_bus: sensor.wago_energy_controls_wago_energy_controls_dc_bus_voltage
sequence:
  # ---------- 1. Start/Stop-knop: wacht tot de sensoren zeggen dat de motor uit is ----------
  - if:
      - condition: template
        value_template: "{{ not (is_state(draait, 'off') and states(toeren) | float(9999) < 50) }}"
    then:
      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}:stop:manual" }
      - wait_template: >-
          {{ (is_state(draait, 'off') and states(toeren) | float(9999) < 50)
             or states(status) == plan ~ ':stop:abort' }}
      - if:
          - condition: template
            value_template: "{{ states(status) == plan ~ ':stop:abort' }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:stop:aborted" }
          - stop: Afgebroken door de bediener
      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}:stop:ok" }
      - delay: 2

  # ---------- 2. keuze Elektrisch, Haven, Anker of Zeilen ----------
  - repeat:
      until: "{{ states(status) in [plan ~ ':modus:ok', plan ~ ':modus:abort'] }}"
      sequence:
        - action: input_text.set_value
          target: { entity_id: "{{ status }}" }
          data: { value: "{{ plan }}:modus:{{ 'confirm' if repeat.first else 'opnieuw' }}" }
        - wait_template: >-
            {{ states(status) in [plan ~ ':modus:elektrisch', plan ~ ':modus:haven', plan ~ ':modus:anker',
                                  plan ~ ':modus:zeilen', plan ~ ':modus:abort'] }}
        - variables:
            gekozen: "{{ states(status).split(':')[2] }}"
        - if:
            - condition: template
              value_template: "{{ gekozen == 'elektrisch' }}"
          then:
            # eerst de DC-bus (>= 700 V): staat hij uit, dan start de bediener de Energy Inverters vanuit het venster
            - if:
                - condition: template
                  value_template: "{{ states(dc_bus) | float(0) < 700 }}"
              then:
                - action: input_text.set_value
                  target: { entity_id: "{{ status }}" }
                  data: { value: "{{ plan }}:modus:dc" }
                - wait_template: "{{ states(dc_bus) | float(0) >= 700 or states(status) == plan ~ ':modus:abort' }}"
            - if:
                - condition: template
                  value_template: "{{ states(status) != plan ~ ':modus:abort' }}"
              then:
                - action: input_text.set_value
                  target: { entity_id: "{{ status }}" }
                  data: { value: "{{ plan }}:modus:busy" }
                - if:
                    - condition: template
                      value_template: "{{ not is_state(elektrisch, 'on') }}"
                  then:
                    - action: button.press
                      target: { entity_id: "{{ elektrischknop }}" }
                    - wait_template: "{{ is_state(elektrisch, 'on') }}"
                      timeout: 20
                      continue_on_timeout: true
        - if:
            - condition: template
              value_template: "{{ gekozen in ['haven', 'anker', 'zeilen'] }}"
          then:
            - action: input_text.set_value
              target: { entity_id: "{{ status }}" }
              data: { value: "{{ plan }}:modus:busy" }
            - action: script.vaarmodus_kiezen
              data: { modus: "{{ gekozen | capitalize }}" }
        # gelukt: ok beëindigt de herhaling; anders volgt "opnieuw" (bij abort stopt de herhaling vanzelf)
        - if:
            - condition: template
              value_template: >-
                {{ states(status) != plan ~ ':modus:abort' and (is_state(elektrisch, 'on') if gekozen == 'elektrisch'
                   else (gekozen != 'abort' and is_state(havenmodus, 'on') and is_state(keuze_haven, gekozen | capitalize))) }}
          then:
            - action: input_text.set_value
              target: { entity_id: "{{ status }}" }
              data: { value: "{{ plan }}:modus:ok" }
  - if:
      - condition: template
        value_template: "{{ states(status) == plan ~ ':modus:abort' }}"
    then:
      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}:modus:aborted" }
      - stop: Afgebroken door de bediener
  - delay: 2

  # ---------- 3. contact uit: alleen bij Haven of Anker (geen sensor: de bediener bevestigt) ----------
  - variables:
      contact_uit: "{{ not is_state(elektrisch, 'on') and states(keuze_haven) in ['Haven', 'Anker'] }}"
  - if:
      - condition: template
        value_template: "{{ contact_uit }}"
    then:
      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}:contact:confirm" }
      - wait_template: "{{ states(status) in [plan ~ ':contact:done', plan ~ ':contact:abort'] }}"
      - if:
          - condition: template
            value_template: "{{ states(status) == plan ~ ':contact:abort' }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:contact:aborted" }
          - stop: Afgebroken door de bediener

  # bij Elektrisch of Zeilen valt de stap contact uit het plan
  - action: input_text.set_value
    target: { entity_id: "{{ status }}" }
    data: { value: "{{ plan if contact_uit else 'stop,modus' }}::complete" }
