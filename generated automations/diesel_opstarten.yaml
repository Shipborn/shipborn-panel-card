# Diesel opstarten – TC90
#
# Package voor Home Assistant: een statushelper en een script. De knop "Start Volvo" (Voortstuwing en Diesel)
# in de Shipborn Panel Card start dit script en toont de stappen live in een venster, met foto's bij de handelingen,
# aan de hand van input_text.diesel_opstarten_status.
# Zonder packages: script_diesel_opstarten.yaml in de UI plakken en de helper in de UI maken (zie README.md).
# Houd dat bestand gelijk met dit bestand.
#
# Stappen (plan, vaste volgorde):
#   prep    systemen rond de diesel: inlaat, uitlaat, wierpot aft en front open, zeewaterpomp glycol en compressor
#           aan, koelwaterflow >= 2,5 en compressordruk >= 3 bar. Staat alles al goed, dan vervalt de stap.
#           Anders start de knop Voorbereiden automation.prepvolvostart; het script wacht tot alles goed staat.
#   motor   bediener start de motor (foto VolvoAanUit.jpeg)  wacht op diesel_running (+2 s), onbeperkt
#   handle  noodstop in, handle recht (foto Volvohandle.jpeg) bediener tikt Gedaan
#   vaar    vaarmodus diesel: alleen via de knop             wacht op diesel_mode (+2 s), 20 s, daarna opnieuw proberen
# In elke stap kan de bediener afbreken. Het script zet dan niets terug: open kleppen, pompen en een draaiende
# motor blijven zoals ze zijn.
#
# Status (input_text.diesel_opstarten_status) = "<plan>:<stap>:<toestand>"
#   toestand  fix       (prep) nog niet alles goed; wacht op de knop Voorbereiden of op abort
#             wacht     (prep) automation gestart; wacht tot alles goed staat of op abort
#             manual    (motor) wacht tot de motor draait of op abort
#             confirm   wacht op de bediener; de kaart schrijft "<plan>:<stap>:<antwoord>" terug: start (prep),
#                       done (handle), select (vaar) of abort
#             opnieuw   (vaar) geen terugmelding binnen 20 s; opnieuw proberen of afbreken
#             busy / ok / aborted / complete   zoals bij Generator opstarten

input_text:
  diesel_opstarten_status:
    name: Diesel opstarten status
    max: 255
    initial: ""          # na een herstart leeg

script:
  diesel_opstarten:
    alias: Diesel opstarten
    description: >-
      Loopt met de bediener de opstart van de Volvo door: systemen rond de diesel voorbereiden, motor starten,
      noodstop en handle controleren en vaarmodus diesel kiezen. Status in input_text.diesel_opstarten_status.
    icon: mdi:engine
    mode: single
    max_exceeded: silent   # tweede start tijdens een lopende run wordt genegeerd
    variables:
      status: input_text.diesel_opstarten_status
      plan: "prep,motor,handle,vaar"
      inlaat: valve.er_ventielblok_1tm4_l4
      uitlaat: valve.er_ventielblok_1tm4_l3
      wierpot_aft: valve.er_ventielblok_1tm4_l2
      wierpot_front: valve.er_ventielblok_1tm4_l1
      pomp: switch.er_zeewaterpomp_cooling
      compressor: switch.0x781c9dfffea18853
      flow: sensor.al1590_er_prop_shaft_cooling_water_flow
      druk: sensor.al1590_er_compressor_manifold_pressure
      draait: binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_running
      dieselmodus: binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_mode
      dieselknop: button.wago_hcs_controls_wago_controls_dieselmode
    sequence:
      # ---------- 1. systemen rond de diesel; de knop Voorbereiden start de bestaande automation ----------
      - if:
          - condition: template
            value_template: "{{ not (is_state(inlaat, 'open') and is_state(uitlaat, 'open') and is_state(wierpot_aft, 'open') and is_state(wierpot_front, 'open') and is_state(pomp, 'on') and is_state(compressor, 'on') and states(flow) | float(0) >= 2.5 and states(druk) | float(0) >= 3) }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:prep:fix" }
          - wait_template: >-
              {{ (is_state(inlaat, 'open') and is_state(uitlaat, 'open') and is_state(wierpot_aft, 'open') and is_state(wierpot_front, 'open') and is_state(pomp, 'on') and is_state(compressor, 'on') and states(flow) | float(0) >= 2.5 and states(druk) | float(0) >= 3)
                 or states(status) in [plan ~ ':prep:start', plan ~ ':prep:abort'] }}
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':prep:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:prep:aborted" }
              - stop: Afgebroken door de bediener
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':prep:start' }}"
            then:
              - action: automation.trigger
                target: { entity_id: automation.prepvolvostart }
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:prep:wacht" }
              - wait_template: >-
                  {{ (is_state(inlaat, 'open') and is_state(uitlaat, 'open') and is_state(wierpot_aft, 'open') and is_state(wierpot_front, 'open') and is_state(pomp, 'on') and is_state(compressor, 'on') and states(flow) | float(0) >= 2.5 and states(druk) | float(0) >= 3)
                     or states(status) == plan ~ ':prep:abort' }}
              - if:
                  - condition: template
                    value_template: "{{ states(status) == plan ~ ':prep:abort' }}"
                then:
                  - action: input_text.set_value
                    target: { entity_id: "{{ status }}" }
                    data: { value: "{{ plan }}:prep:aborted" }
                  - stop: Afgebroken door de bediener
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:prep:ok" }
          - delay: 2

      # ---------- 2. bediener start de motor (foto); overgeslagen als hij al draait ----------
      - if:
          - condition: template
            value_template: "{{ not is_state(draait, 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:motor:manual" }
          - wait_template: "{{ is_state(draait, 'on') or states(status) == plan ~ ':motor:abort' }}"
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':motor:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:motor:aborted" }
              - stop: Afgebroken door de bediener
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:motor:ok" }
          - delay: 2

      # ---------- 3. noodstop in en handle recht (foto) ----------
      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}:handle:confirm" }
      - wait_template: "{{ states(status) in [plan ~ ':handle:done', plan ~ ':handle:abort'] }}"
      - if:
          - condition: template
            value_template: "{{ states(status) == plan ~ ':handle:abort' }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:handle:aborted" }
          - stop: Afgebroken door de bediener

      # ---------- 4. vaarmodus diesel: alleen na een tik op de knop in het venster ----------
      - if:
          - condition: template
            value_template: "{{ not is_state(dieselmodus, 'on') }}"
        then:
          - repeat:
              until: "{{ is_state(dieselmodus, 'on') or states(status) == plan ~ ':vaar:abort' }}"
              sequence:
                - action: input_text.set_value
                  target: { entity_id: "{{ status }}" }
                  data: { value: "{{ plan }}:vaar:{{ 'confirm' if repeat.first else 'opnieuw' }}" }
                - wait_template: >-
                    {{ is_state(dieselmodus, 'on')
                       or states(status) in [plan ~ ':vaar:select', plan ~ ':vaar:abort'] }}
                - if:
                    - condition: template
                      value_template: "{{ states(status) == plan ~ ':vaar:select' }}"
                  then:
                    - action: input_text.set_value
                      target: { entity_id: "{{ status }}" }
                      data: { value: "{{ plan }}:vaar:busy" }
                    - action: button.press
                      target: { entity_id: "{{ dieselknop }}" }
                    - wait_template: "{{ is_state(dieselmodus, 'on') }}"
                      timeout: 20
                      continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':vaar:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:vaar:aborted" }
              - stop: Afgebroken door de bediener
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:vaar:ok" }
          - delay: 2

      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}::complete" }
