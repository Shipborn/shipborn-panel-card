# Generator afsluiten – TC90
#
# Package voor Home Assistant: een script. De knop "Generator afsluiten" (Voortstuwing en Generator) in de
# Shipborn Panel Card start dit script en toont de stappen live in een venster. Het script gebruikt dezelfde
# statushelper als Generator opstarten (input_text.generator_opstarten_status, uit generator_opstarten.yaml):
# er loopt toch maar één van beide tegelijk.
# Zonder packages: script_generator_afsluiten.yaml in de UI plakken (zie README.md). Houd dat bestand gelijk
# met dit bestand.
#
# Stappen (plan, vaste volgorde):
#   wal      walstroom aanwezig (shore_supply_is_on)         zo niet: wachten tot hij er is (of afbreken)
#   lad_uit  Charge batteries uit                            zo niet: knop Uitzetten
#   accu     accu gekoppeld (bms_is_on)                      zo niet: knop Koppelen (battery_connect_2 aan)
#   gen_uit  generator-drive uit (generator_2 uit)           wacht tot generator_is_connected uit (+2 s), 20 s
#   stop     generator uit (manual_start_aux_generator_2 uit) wacht tot generator_is_on uit (+2 s), 60 s
#   wal_aan  walstroom-drive aan (shore_supply_2 aan)        wacht op shore_supply_is_connected (+2 s), 20 s
# In de stappen wal t/m accu kan de bediener afbreken (dan is er door het script nog niets geschakeld).
# Bij een timeout (gen_uit, stop, wal_aan) wacht het script door; de kaart vraagt terugdraaien of blijven
# wachten. Terugdraaien zet terug wat het script in deze run geschakeld heeft, laatste eerst (walstroom-drive
# uit, generator-request aan, generator-drive aan). Stappen die al goed staan worden overgeslagen.
# Is de generator handmatig gestart (aan het lokale paneel), dan zet manual_start_aux_generator_2 hem niet uit:
# na 60 s meldt de kaart dat, en kan de bediener hem lokaal uitzetten (het script wacht door).
#
# Status (input_text.generator_opstarten_status) = "<plan>:<stap>:<toestand>", zoals bij Generator opstarten:
#   fix / busy / ok / timeout / rollback / rolling_back / rolled_back / aborted / complete
#   (zie generator_opstarten.yaml). De kaart schrijft "<plan>:<stap>:abort" of "…:rollback" terug.

script:
  generator_afsluiten:
    alias: Generator afsluiten
    description: >-
      Zet de generator af en de boot terug op walstroom: controleert walstroom aanwezig, Charge batteries uit
      en accu gekoppeld, zet dan de generator-drive uit, de generator uit en de walstroom-drive aan.
      Status in input_text.generator_opstarten_status.
    icon: mdi:engine-off
    mode: single
    max_exceeded: silent   # tweede start tijdens een lopende run wordt genegeerd
    variables:
      status: input_text.generator_opstarten_status
      plan: "wal,lad_uit,accu,gen_uit,stop,wal_aan"
      wal_aanwezig: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_on
      laden: switch.wago_energy_controls_wago_energy_controls_charge_batteries_2
      accu: binary_sensor.wago_energy_controls_wago_energy_controls_bms_is_on
      schakelaar:
        gen_uit: switch.wago_energy_controls_wago_energy_controls_generator_2
        stop: switch.wago_energy_controls_wago_energy_controls_manual_start_aux_generator_2
        wal_aan: switch.wago_energy_controls_wago_energy_controls_shore_supply_2
      terugmelding:
        gen_uit: binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_connected
        stop: binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_on
        wal_aan: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_connected
      aanzetten:           # true = de stap zet zijn schakelaar aan, false = uit
        gen_uit: false
        stop: false
        wal_aan: true
      wachttijd:           # seconden tot de kaart terugdraaien / blijven wachten aanbiedt
        gen_uit: 20
        stop: 60
        wal_aan: 20
    sequence:
      # ---------- 1. walstroom moet aanwezig zijn (nog niet gekoppeld) ----------
      - if:
          - condition: template
            value_template: "{{ not is_state(wal_aanwezig, 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:wal:fix" }
          - wait_template: "{{ is_state(wal_aanwezig, 'on') or states(status) == plan ~ ':wal:abort' }}"
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':wal:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:wal:aborted" }
              - stop: Afgebroken door de bediener

      # ---------- 2. Charge batteries moet uit zijn ----------
      - if:
          - condition: template
            value_template: "{{ is_state(laden, 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:lad_uit:fix" }
          - wait_template: "{{ is_state(laden, 'off') or states(status) == plan ~ ':lad_uit:abort' }}"
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':lad_uit:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:lad_uit:aborted" }
              - stop: Afgebroken door de bediener

      # ---------- 3. accu moet gekoppeld zijn (BMS aan) ----------
      - if:
          - condition: template
            value_template: "{{ not is_state(accu, 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:accu:fix" }
          - wait_template: "{{ is_state(accu, 'on') or states(status) == plan ~ ':accu:abort' }}"
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':accu:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:accu:aborted" }
              - stop: Afgebroken door de bediener

      # ---------- 4 t/m 6: schakelen en wachten op de terugmelding ----------
      # Alleen de stappen die echt iets veranderen; die worden bij terugdraaien ook teruggezet.
      - variables:
          stappen: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for s in ['gen_uit', 'stop', 'wal_aan'] -%}
              {%- set doel = 'on' if aanzetten[s] else 'off' -%}
              {%- if not is_state(schakelaar[s], doel) or not is_state(terugmelding[s], doel) -%}
                {%- set ns.l = ns.l + [s] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
      - repeat:
          for_each: "{{ stappen }}"
          sequence:
            - variables:
                stap: "{{ repeat.item }}"
                nr: "{{ repeat.index }}"
                doel: "{{ 'on' if aanzetten[repeat.item] else 'off' }}"
            - action: input_text.set_value
              target: { entity_id: "{{ status }}" }
              data: { value: "{{ plan }}:{{ stap }}:busy" }
            - if:
                - condition: template
                  value_template: "{{ aanzetten[stap] }}"
              then:
                - action: switch.turn_on
                  target: { entity_id: "{{ schakelaar[stap] }}" }
              else:
                - action: switch.turn_off
                  target: { entity_id: "{{ schakelaar[stap] }}" }
            - wait_template: "{{ is_state(terugmelding[stap], doel) }}"
              timeout: "{{ wachttijd[stap] }}"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ not wait.completed }}"
              then:
                # geen reactie: melden en doorwachten tot de terugmelding of tot de gebruiker terugdraait
                - action: input_text.set_value
                  target: { entity_id: "{{ status }}" }
                  data: { value: "{{ plan }}:{{ stap }}:timeout" }
                - wait_template: >-
                    {{ is_state(terugmelding[stap], doel)
                       or states(status) == plan ~ ':' ~ stap ~ ':rollback' }}
                - if:
                    - condition: template
                      value_template: "{{ not is_state(terugmelding[stap], doel) }}"
                  then:
                    # terugdraaien: alles wat dit script schakelde terug, laatste eerst
                    - action: input_text.set_value
                      target: { entity_id: "{{ status }}" }
                      data: { value: "{{ plan }}:{{ stap }}:rolling_back" }
                    - repeat:
                        for_each: "{{ stappen[:nr] | reverse | list }}"
                        sequence:
                          - if:
                              - condition: template
                                value_template: "{{ aanzetten[repeat.item] }}"
                            then:
                              - action: switch.turn_off
                                target: { entity_id: "{{ schakelaar[repeat.item] }}" }
                            else:
                              - action: switch.turn_on
                                target: { entity_id: "{{ schakelaar[repeat.item] }}" }
                    - action: input_text.set_value
                      target: { entity_id: "{{ status }}" }
                      data: { value: "{{ plan }}:{{ stap }}:rolled_back" }
                    - stop: Teruggedraaid op verzoek van de gebruiker
            - action: input_text.set_value
              target: { entity_id: "{{ status }}" }
              data: { value: "{{ plan }}:{{ stap }}:ok" }
            - delay: 2

      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}::complete" }
