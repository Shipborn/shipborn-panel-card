# Energy Inverters (DC-bus) opstarten en afsluiten – TC90
#
# Package voor Home Assistant: een statushelper en twee scripts. De knoppen
# "Energy Inverters opstarten" (Energie en Voortstuwing) en "Energy Inverters
# afsluiten" (Energie) in de Shipborn Panel Card starten deze scripts en tonen de
# voortgang live in een venster, aan de hand van input_text.energy_inverters_status.
#
# Installeren: zie README.md in deze map.
#
# Status (input_text.energy_inverters_status) = "<plan>:<stap>:<toestand>"
#   plan      de stappen van deze run, in volgorde, bijv. "battery,shore"
#   stap      battery | shore | generator (leeg bij complete)
#   toestand  busy        stap loopt, wacht op de terugmelding
#             timeout     geen terugmelding binnen 5 s: gestopt, wat al geschakeld is blijft staan
#             unavailable gekozen bron is niet beschikbaar: niets geschakeld
#             complete    alle stappen gelukt
# Voorbeelden: "battery,shore:battery:busy", "battery,generator:generator:timeout",
#              "battery,shore::complete", "shore,battery:shore:busy" (afsluiten).

input_text:
  energy_inverters_status:
    name: Energy Inverters status
    max: 100
    initial: ""          # na een herstart leeg, zodat er nooit een oude "busy" blijft staan

script:
  # ---------- opstarten: accu → (walstroom of generator) ----------
  energy_inverters_opstarten:
    alias: Energy Inverters opstarten
    description: >-
      Koppelt eerst de accu (battery connect) en wacht tot het BMS aan is, daarna
      (naar keuze) walstroom of generator en wacht tot die gekoppeld is. Per stap 5 s;
      reageert een drive niet, dan stopt het script en blijft staan wat al aan is.
    icon: mdi:flash
    mode: single
    max_exceeded: silent   # tweede start tijdens een lopende run wordt genegeerd
    fields:
      bron:
        name: Bron
        description: "shore = walstroom, generator = generator, battery = alleen accu"
        required: true
        default: battery
        selector:
          select:
            options:
              - shore
              - generator
              - battery
    variables:
      status: input_text.energy_inverters_status
      accu_switch: switch.wago_energy_controls_wago_energy_controls_battery_connect_2
      accu_online: binary_sensor.wago_energy_controls_wago_energy_controls_bms_is_on
      bron_switch:
        shore: switch.wago_energy_controls_wago_energy_controls_shore_supply_2
        generator: switch.wago_energy_controls_wago_energy_controls_generator_2
      bron_beschikbaar:
        shore: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_on
        generator: binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_on
      bron_gekoppeld:
        shore: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_connected
        generator: binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_connected
      extern: "{{ bron in ['shore', 'generator'] }}"
      plan: "{{ 'battery,' ~ bron if extern else 'battery' }}"
    sequence:
      # gekozen bron moet beschikbaar zijn (de kaart laat alleen beschikbare bronnen kiezen; dit is de tweede controle)
      - if:
          - condition: template
            value_template: "{{ extern and not is_state(bron_beschikbaar[bron], 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:{{ bron }}:unavailable" }
          - stop: Gekozen bron is niet beschikbaar

      # stap 1: accu koppelen en wachten op het BMS
      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}:battery:busy" }
      - action: switch.turn_on
        target: { entity_id: "{{ accu_switch }}" }
      - wait_template: "{{ is_state(accu_online, 'on') }}"
        timeout: "00:00:05"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:battery:timeout" }
          - stop: Accu-drive reageert niet

      # stap 2: walstroom of generator koppelen en wachten tot hij gekoppeld is
      - if:
          - condition: template
            value_template: "{{ extern }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:{{ bron }}:busy" }
          - action: switch.turn_on
            target: { entity_id: "{{ bron_switch[bron] }}" }
          - wait_template: "{{ is_state(bron_gekoppeld[bron], 'on') }}"
            timeout: "00:00:05"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:{{ bron }}:timeout" }
              - stop: Drive van de bron reageert niet

      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}::complete" }

  # ---------- afsluiten: (walstroom en/of generator) → accu ----------
  energy_inverters_afsluiten:
    alias: Energy Inverters afsluiten
    description: >-
      Ontkoppelt eerst de externe voeding die gekoppeld is (walstroom en/of generator)
      en wacht tot die offline is, daarna de accu (battery connect) en wacht tot het BMS
      uit is. Per stap 5 s; reageert een drive niet, dan stopt het script.
    icon: mdi:flash-off
    mode: single
    max_exceeded: silent
    variables:
      status: input_text.energy_inverters_status
      accu_switch: switch.wago_energy_controls_wago_energy_controls_battery_connect_2
      accu_online: binary_sensor.wago_energy_controls_wago_energy_controls_bms_is_on
      bron_switch:
        shore: switch.wago_energy_controls_wago_energy_controls_shore_supply_2
        generator: switch.wago_energy_controls_wago_energy_controls_generator_2
      bron_gekoppeld:
        shore: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_connected
        generator: binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_connected
      # alleen wat gekoppeld is (of waarvan de switch nog aan staat)
      bronnen: >-
        {{ (['shore'] if is_state(bron_gekoppeld.shore, 'on') or is_state(bron_switch.shore, 'on') else [])
           + (['generator'] if is_state(bron_gekoppeld.generator, 'on') or is_state(bron_switch.generator, 'on') else []) }}
      plan: "{{ (bronnen + ['battery']) | join(',') }}"
    sequence:
      # stap 1..n: externe voeding ontkoppelen en wachten tot hij offline is
      - repeat:
          for_each: "{{ bronnen }}"
          sequence:
            - action: input_text.set_value
              target: { entity_id: "{{ status }}" }
              data: { value: "{{ plan }}:{{ repeat.item }}:busy" }
            - action: switch.turn_off
              target: { entity_id: "{{ bron_switch[repeat.item] }}" }
            - wait_template: "{{ is_state(bron_gekoppeld[repeat.item], 'off') }}"
              timeout: "00:00:05"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ not wait.completed }}"
              then:
                - action: input_text.set_value
                  target: { entity_id: "{{ status }}" }
                  data: { value: "{{ plan }}:{{ repeat.item }}:timeout" }
                - stop: Drive van de bron reageert niet

      # laatste stap: accu ontkoppelen en wachten tot het BMS uit is
      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}:battery:busy" }
      - action: switch.turn_off
        target: { entity_id: "{{ accu_switch }}" }
      - wait_template: "{{ is_state(accu_online, 'off') }}"
        timeout: "00:00:05"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:battery:timeout" }
          - stop: Accu-drive reageert niet

      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}::complete" }
