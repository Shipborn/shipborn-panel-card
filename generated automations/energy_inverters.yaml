# Energy Inverters (DC-bus) opstarten en afsluiten – TC90
#
# Package voor Home Assistant: een statushelper en twee scripts. De knoppen
# "Energy Inverters opstarten" (Energie en Voortstuwing) en "Energy Inverters
# afsluiten" (Energie) in de Shipborn Panel Card starten deze scripts en tonen de
# voortgang live in een venster, aan de hand van input_text.energy_inverters_status.
# Zonder packages: de losse bestanden script_energy_inverters_*.yaml in de UI plakken
# en de helper in de UI maken (zie README.md). Houd die bestanden gelijk met dit bestand.
#
# Beide scripts controleren eerst (stap lad_uit) dat Charge batteries (charge_batteries_2) uit staat. Staat
# hij aan, dan zet het script de status op "fix" en wacht het tot hij uit is (de kaart biedt een knop
# Uitzetten) of tot de bediener afbreekt ("<plan>:lad_uit:abort" → "aborted", er is dan niets geschakeld).
# Dit is alleen een controle bij het opstarten en afsluiten, geen blijvende vergrendeling.
#
# Per stap wordt 20 s op de terugmelding gewacht. Komt die niet, dan zet het script de
# status op "timeout" maar BLIJFT het wachten. De kaart vraagt dan: terugdraaien of
# blijven wachten. Komt de terugmelding alsnog, dan gaat het script gewoon verder.
# Kiest de gebruiker "terugdraaien", dan schrijft de kaart "<plan>:<stap>:rollback" in de
# status; het script draait dan alle stappen van deze run terug (ook de huidige), in
# omgekeerde volgorde, en stopt.
#
# Status (input_text.energy_inverters_status) = "<plan>:<stap>:<toestand>"
#   plan      de stappen van deze run, in volgorde, bijv. "lad_uit,battery,shore"
#   stap      lad_uit | battery | shore | generator (leeg bij complete)
#   toestand  fix          (lad_uit) Charge batteries staat aan; wacht tot hij uit is of op abort
#             aborted      afgebroken door de bediener in stap lad_uit, script gestopt
#             busy         stap loopt, wacht op de terugmelding
#             timeout      geen terugmelding binnen 20 s; het script wacht door
#             rollback     (geschreven door de kaart) de gebruiker wil terugdraaien
#             rolling_back het script draait terug
#             rolled_back  teruggedraaid, script gestopt
#             unavailable  gekozen bron is niet beschikbaar: niets geschakeld
#             complete     alle stappen gelukt
# Voorbeelden: "lad_uit,battery,shore:lad_uit:fix", "lad_uit,battery,shore:battery:busy",
#              "lad_uit,battery,generator:generator:timeout", "lad_uit,battery,shore::complete",
#              "lad_uit,shore,battery:shore:busy" (afsluiten).

input_text:
  energy_inverters_status:
    name: Energy Inverters status
    max: 100
    initial: ""          # na een herstart leeg

script:
  # ---------- opstarten: accu → (walstroom of generator) ----------
  energy_inverters_opstarten:
    alias: Energy Inverters opstarten
    description: >-
      Controleert dat Charge batteries uit staat. Koppelt dan de accu (battery connect) en wacht tot het BMS aan is, daarna
      (naar keuze) walstroom of generator en wacht tot die gekoppeld is. Na 20 s zonder
      terugmelding vraagt de kaart: terugdraaien of blijven wachten.
    icon: mdi:flash
    mode: single
    max_exceeded: silent   # tweede start tijdens een lopende run wordt genegeerd
    fields:
      bron:
        name: Bron
        description: "shore = walstroom, generator = generator, battery = alleen accu"
        required: true
        default: battery
        selector:
          select:
            options:
              - shore
              - generator
              - battery
    variables:
      status: input_text.energy_inverters_status
      schakelaar:
        battery: switch.wago_energy_controls_wago_energy_controls_battery_connect_2
        shore: switch.wago_energy_controls_wago_energy_controls_shore_supply_2
        generator: switch.wago_energy_controls_wago_energy_controls_generator_2
      terugmelding:
        battery: binary_sensor.wago_energy_controls_wago_energy_controls_bms_is_on
        shore: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_connected
        generator: binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_connected
      beschikbaar:
        shore: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_on
        generator: binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_on
      laden: switch.wago_energy_controls_wago_energy_controls_charge_batteries_2
      extern: "{{ bron in ['shore', 'generator'] }}"
      stappen: "{{ ['battery'] + ([bron] if extern else []) }}"
      plan: "{{ (['lad_uit'] + stappen) | join(',') }}"
    sequence:
      # gekozen bron moet beschikbaar zijn (de kaart laat alleen beschikbare bronnen kiezen; dit is de tweede controle)
      - if:
          - condition: template
            value_template: "{{ extern and not is_state(beschikbaar[bron], 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:{{ bron }}:unavailable" }
          - stop: Gekozen bron is niet beschikbaar

      # Charge batteries moet uit zijn (alleen tijdens het opstarten gecontroleerd)
      - if:
          - condition: template
            value_template: "{{ is_state(laden, 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:lad_uit:fix" }
          - wait_template: "{{ is_state(laden, 'off') or states(status) == plan ~ ':lad_uit:abort' }}"
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':lad_uit:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:lad_uit:aborted" }
              - stop: Afgebroken door de bediener

      - repeat:
          for_each: "{{ stappen }}"
          sequence:
            - variables:
                stap: "{{ repeat.item }}"
                nr: "{{ repeat.index }}"
            - action: input_text.set_value
              target: { entity_id: "{{ status }}" }
              data: { value: "{{ plan }}:{{ stap }}:busy" }
            - action: switch.turn_on
              target: { entity_id: "{{ schakelaar[stap] }}" }
            - wait_template: "{{ is_state(terugmelding[stap], 'on') }}"
              timeout: "00:00:20"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ not wait.completed }}"
              then:
                # geen reactie binnen 20 s: melden en doorwachten tot de terugmelding of tot de gebruiker terugdraait
                - action: input_text.set_value
                  target: { entity_id: "{{ status }}" }
                  data: { value: "{{ plan }}:{{ stap }}:timeout" }
                - wait_template: >-
                    {{ is_state(terugmelding[stap], 'on')
                       or states(status) == plan ~ ':' ~ stap ~ ':rollback' }}
                - if:
                    - condition: template
                      value_template: "{{ not is_state(terugmelding[stap], 'on') }}"
                  then:
                    # terugdraaien: alles van deze run uit, laatste eerst (dus de bron vóór de accu)
                    - action: input_text.set_value
                      target: { entity_id: "{{ status }}" }
                      data: { value: "{{ plan }}:{{ stap }}:rolling_back" }
                    - repeat:
                        for_each: "{{ stappen[:nr] | reverse | list }}"
                        sequence:
                          - action: switch.turn_off
                            target: { entity_id: "{{ schakelaar[repeat.item] }}" }
                    - action: input_text.set_value
                      target: { entity_id: "{{ status }}" }
                      data: { value: "{{ plan }}:{{ stap }}:rolled_back" }
                    - stop: Teruggedraaid op verzoek van de gebruiker

      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}::complete" }

  # ---------- afsluiten: (walstroom en/of generator) → accu ----------
  energy_inverters_afsluiten:
    alias: Energy Inverters afsluiten
    description: >-
      Controleert dat Charge batteries uit staat. Ontkoppelt dan de externe voeding die gekoppeld is (walstroom en/of generator)
      en wacht tot die offline is, daarna de accu (battery connect) en wacht tot het BMS
      uit is. Na 20 s zonder terugmelding vraagt de kaart: terugdraaien of blijven wachten.
    icon: mdi:flash-off
    mode: single
    max_exceeded: silent
    variables:
      status: input_text.energy_inverters_status
      schakelaar:
        battery: switch.wago_energy_controls_wago_energy_controls_battery_connect_2
        shore: switch.wago_energy_controls_wago_energy_controls_shore_supply_2
        generator: switch.wago_energy_controls_wago_energy_controls_generator_2
      terugmelding:
        battery: binary_sensor.wago_energy_controls_wago_energy_controls_bms_is_on
        shore: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_connected
        generator: binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_connected
      # alleen wat gekoppeld is (of waarvan de switch nog aan staat), daarna altijd de accu
      stappen: >-
        {{ (['shore'] if is_state(terugmelding.shore, 'on') or is_state(schakelaar.shore, 'on') else [])
           + (['generator'] if is_state(terugmelding.generator, 'on') or is_state(schakelaar.generator, 'on') else [])
           + ['battery'] }}
      laden: switch.wago_energy_controls_wago_energy_controls_charge_batteries_2
      plan: "{{ (['lad_uit'] + stappen) | join(',') }}"
    sequence:
      # Charge batteries moet uit zijn (alleen tijdens het afsluiten gecontroleerd)
      - if:
          - condition: template
            value_template: "{{ is_state(laden, 'on') }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:lad_uit:fix" }
          - wait_template: "{{ is_state(laden, 'off') or states(status) == plan ~ ':lad_uit:abort' }}"
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':lad_uit:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:lad_uit:aborted" }
              - stop: Afgebroken door de bediener

      - repeat:
          for_each: "{{ stappen }}"
          sequence:
            - variables:
                stap: "{{ repeat.item }}"
                nr: "{{ repeat.index }}"
            - action: input_text.set_value
              target: { entity_id: "{{ status }}" }
              data: { value: "{{ plan }}:{{ stap }}:busy" }
            - action: switch.turn_off
              target: { entity_id: "{{ schakelaar[stap] }}" }
            - wait_template: "{{ is_state(terugmelding[stap], 'off') }}"
              timeout: "00:00:20"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ not wait.completed }}"
              then:
                - action: input_text.set_value
                  target: { entity_id: "{{ status }}" }
                  data: { value: "{{ plan }}:{{ stap }}:timeout" }
                - wait_template: >-
                    {{ is_state(terugmelding[stap], 'off')
                       or states(status) == plan ~ ':' ~ stap ~ ':rollback' }}
                - if:
                    - condition: template
                      value_template: "{{ not is_state(terugmelding[stap], 'off') }}"
                  then:
                    # terugdraaien: alles van deze run weer aan, laatste eerst (dus de accu vóór de bron)
                    - action: input_text.set_value
                      target: { entity_id: "{{ status }}" }
                      data: { value: "{{ plan }}:{{ stap }}:rolling_back" }
                    - repeat:
                        for_each: "{{ stappen[:nr] | reverse | list }}"
                        sequence:
                          - action: switch.turn_on
                            target: { entity_id: "{{ schakelaar[repeat.item] }}" }
                    - action: input_text.set_value
                      target: { entity_id: "{{ status }}" }
                      data: { value: "{{ plan }}:{{ stap }}:rolled_back" }
                    - stop: Teruggedraaid op verzoek van de gebruiker

      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}::complete" }
