# Vaarmodus Haven / Anker / Zeilen – TC90
#
# De PLC kent alleen havenmodus. Anker en Zeilen bestaan alleen in Home Assistant: alle drie zetten de PLC in
# havenmodus, en input_select.vaarmodus_haven onthoudt welke van de drie gekozen is.
#   Geen    de PLC staat niet in havenmodus (diesel of elektrisch)
#   Haven / Anker / Zeilen    de PLC staat in havenmodus, met deze keuze
# Het script zet de keuze en drukt zo nodig de havenknop van de PLC in. De automation houdt de helper gelijk aan
# de PLC: gaat de havenmodus uit, dan wordt het Geen; gaat hij aan zonder keuze (bijv. via de PLC), dan Haven.
# Elektrisch loopt via script.vaarmodus_elektrisch: staat de DC-bus uit, dan eerst de Energy Inverters opstarten.
# Zonder packages: de helpers in de UI maken en script_vaarmodus_kiezen.yaml, script_vaarmodus_elektrisch.yaml en
# automation_vaarmodus_haven.yaml plakken (zie README.md). Houd die bestanden gelijk met dit bestand.

input_text:
  vaarmodus_elektrisch_status:
    name: Vaarmodus elektrisch status
    max: 255

input_select:
  vaarmodus_haven:
    name: Vaarmodus haven
    options:
      - Geen
      - Haven
      - Anker
      - Zeilen

script:
  vaarmodus_kiezen:
    alias: Vaarmodus kiezen
    description: >-
      Kiest Haven, Anker of Zeilen: onthoudt de keuze in input_select.vaarmodus_haven en zet de PLC in havenmodus.
      Komt er binnen 20 s geen terugmelding, dan gaat de keuze terug naar Geen.
    icon: mdi:anchor
    mode: single
    max_exceeded: silent
    fields:
      modus:
        name: Modus
        required: true
        default: Haven
        selector:
          select:
            options:
              - Haven
              - Anker
              - Zeilen
    variables:
      keuze: input_select.vaarmodus_haven
      havenmodus: binary_sensor.wago_hcs_controls_wago_hcs_controls_harbor_mode
      havenknop: button.wago_hcs_controls_wago_controls_harbormode
    sequence:
      # eerst de keuze, dan de PLC: zo ziet de automation bij "haven aan" al de juiste keuze
      - action: input_select.select_option
        target: { entity_id: "{{ keuze }}" }
        data: { option: "{{ modus }}" }
      - if:
          - condition: template
            value_template: "{{ not is_state(havenmodus, 'on') }}"
        then:
          - action: button.press
            target: { entity_id: "{{ havenknop }}" }
          - wait_template: "{{ is_state(havenmodus, 'on') }}"
            timeout: 20
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not is_state(havenmodus, 'on') }}"
            then:
              - action: input_select.select_option
                target: { entity_id: "{{ keuze }}" }
                data: { option: Geen }

  # Elektrisch: eerst DC-bus controleren (zie script_vaarmodus_elektrisch.yaml)
  vaarmodus_elektrisch:
    alias: Vaarmodus elektrisch
    description: >-
      Controleert of de DC-bus aan staat (minstens 700 V). Staat hij uit, dan start de bediener eerst de Energy Inverters.
      Daarna gaat de PLC in elektrische modus. Status in input_text.vaarmodus_elektrisch_status.
    icon: mdi:flash
    mode: single
    max_exceeded: silent   # tweede start tijdens een lopende run wordt genegeerd
    variables:
      status: input_text.vaarmodus_elektrisch_status
      plan: "dc,modus"
      dc_bus: sensor.wago_energy_controls_wago_energy_controls_dc_bus_voltage
      elektrisch: binary_sensor.wago_hcs_controls_wago_hcs_controls_electric_mode
      elektrischknop: button.wago_hcs_controls_wago_controls_electricmode
    sequence:
      # ---------- 1. DC-bus aan (>= 700 V); anders start de bediener hem via het Energy Inverters-venster ----------
      - if:
          - condition: template
            value_template: "{{ states(dc_bus) | float(0) < 700 }}"
        then:
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:dc:fix" }
          - wait_template: "{{ states(dc_bus) | float(0) >= 700 or states(status) == plan ~ ':dc:abort' }}"
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':dc:abort' }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:dc:aborted" }
              - stop: Afgebroken door de bediener
          - action: input_text.set_value
            target: { entity_id: "{{ status }}" }
            data: { value: "{{ plan }}:dc:ok" }
          - delay: 1

      # ---------- 2. elektrische modus; na 20 s zonder terugmelding opnieuw of afbreken ----------
      - if:
          - condition: template
            value_template: "{{ not is_state(elektrisch, 'on') }}"
        then:
          - repeat:
              until: "{{ is_state(elektrisch, 'on') or states(status) == plan ~ ':modus:abort' }}"
              sequence:
                - action: input_text.set_value
                  target: { entity_id: "{{ status }}" }
                  data: { value: "{{ plan }}:modus:busy" }
                - action: button.press
                  target: { entity_id: "{{ elektrischknop }}" }
                - wait_template: "{{ is_state(elektrisch, 'on') }}"
                  timeout: 20
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: "{{ not is_state(elektrisch, 'on') }}"
                  then:
                    - action: input_text.set_value
                      target: { entity_id: "{{ status }}" }
                      data: { value: "{{ plan }}:modus:opnieuw" }
                    - wait_template: >-
                        {{ is_state(elektrisch, 'on')
                           or states(status) in [plan ~ ':modus:retry', plan ~ ':modus:abort'] }}
          - if:
              - condition: template
                value_template: "{{ states(status) == plan ~ ':modus:abort' and not is_state(elektrisch, 'on') }}"
            then:
              - action: input_text.set_value
                target: { entity_id: "{{ status }}" }
                data: { value: "{{ plan }}:modus:aborted" }
              - stop: Afgebroken door de bediener

      - action: input_text.set_value
        target: { entity_id: "{{ status }}" }
        data: { value: "{{ plan }}::complete" }

automation:
  - id: vaarmodus_haven_volgt_plc
    alias: Vaarmodus haven volgt PLC
    description: Houdt input_select.vaarmodus_haven gelijk aan de havenmodus van de PLC.
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.wago_hcs_controls_wago_hcs_controls_harbor_mode
        to: ["on", "off"]
        not_from: [unavailable, unknown]   # een korte storing mag de keuze Anker / Zeilen niet wissen
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.wago_hcs_controls_wago_hcs_controls_harbor_mode
                state: "off"
            sequence:
              - action: input_select.select_option
                target: { entity_id: input_select.vaarmodus_haven }
                data: { option: Geen }
          - conditions:
              - condition: state
                entity_id: binary_sensor.wago_hcs_controls_wago_hcs_controls_harbor_mode
                state: "on"
              - condition: state
                entity_id: input_select.vaarmodus_haven
                state: Geen
            sequence:
              - action: input_select.select_option
                target: { entity_id: input_select.vaarmodus_haven }
                data: { option: Haven }
