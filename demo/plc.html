<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLC dashboard demo</title>
  <style>
    body { margin: 0; padding-bottom: 120px; background: #0d0e10; font-family: sans-serif; } /* room for the fixed icon bar */
    #view { max-width: 1280px; margin: 0 auto; }
    #log { max-width: 1280px; margin: 8px auto; font: 12px monospace; color: #8f8e88; }
    #sim { max-width: 1280px; margin: 8px auto; display: flex; flex-wrap: wrap; gap: 6px 16px; font: 12px monospace; color: #cfcec8; }
    #sim label { cursor: pointer; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="../dist/shipborn-panel-card.js"></script>
</head>
<body>
  <div id="view"></div>
  <div id="sim"></div>
  <div id="log">Mock: service calls verschijnen hier (geen echte HA).</div>
  <script>
    // Tabs in the card navigate as in HA (/<dashboard>/<view>), which does not exist here: go to ?view=<view> instead.
    window.addEventListener("location-changed", () => {
      location.replace(`plc.html?view=${encodeURIComponent(location.pathname.split("/").pop())}`);
    });
    // Renders a view of examples/plc-dashboard.yaml (?view=<path>, default the first) with fake entity states.
    (async () => {
      const yaml = await (await fetch("../examples/plc-dashboard.yaml")).text();
      const views = jsyaml.load(yaml).views;
      const wanted = new URLSearchParams(location.search).get("view");
      const cfg = (views.find((v) => v.path === wanted) || views[0]).cards[0];
      const now = new Date().toISOString();
      const st = (state, attributes = {}) => ({ state: String(state), attributes, last_changed: now });
      const states = {
        "sensor.plc_active_alarm": st("026 Jetvalve 3 won't move to starboard"),
        "binary_sensor.plc_alarm_active": st("on"),
        "sensor.er_alarm_status_active_alarms": st(2, { alarms: ["Bilge engine room high", "Diesel PS level low"] }),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_harbor_mode": st("on"),
        "binary_sensor.plc_gear_neutral": st("on"),
        "sensor.engine_room_main_engine_me_rpm": st(1450, { unit_of_measurement: "rpm" }),
        "sensor.plc_electric_speed": st(-1200, { unit_of_measurement: "rpm" }),
        "sensor.wago_hcs_controls_wago_hcs_controls_shaft_speed": st(180, { unit_of_measurement: "rpm" }),
        "sensor.wago_energy_controls_wago_energy_controls_bms_state_of_charge": st(72, { unit_of_measurement: "%" }),
        "binary_sensor.plc_battery_discharging": st("on"),
        "sensor.engine_room_main_engine_me_coolant_temp": st(82, { unit_of_measurement: "°C" }),
        "sensor.wago_values_er_diesel_daytank_level_statistics": st(64, { unit_of_measurement: "%" }),
        "sensor.al1590_er_prop_shaft_grease_pressure": st(0.45),
        "sensor.al1590_er_prop_shaft_grease_temperature": st(21.4),
        "sensor.al1590_er_volvo_exhaust_temperature": st(48.2),
        "sensor.al1590_er_volvo_seawater_cooling_flow": st(38.5),
        "switch.er_zeewaterpomp_cooling": st("on"),
        // Tank levels in %, and the compressor pressure in bar, as in HA.
        "sensor.wago_values_er_diesel_ps_level": st(79),
        "sensor.wago_plc_er_diesel_sb_level": st(51),
        "sensor.wago_values_aft_diesel_webasto_level_statistics": st(41, { unit_of_measurement: "%" }),
        "sensor.wago_values_lr_fresh_water_level": st(66),
        "sensor.wago_values_er_dirtywater_level": st(22),
        "sensor.al1590_er_compressor_manifold_pressure": st(6.475, { unit_of_measurement: "bar" }),
        // Voortstuwing (design: tc90).
        "binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_on": st("on"),
        "sensor.engine_room_me_oil_press": st(3.4, { unit_of_measurement: "bar" }),
        "sensor.main_engine_oil_temp": st(92, { unit_of_measurement: "°C" }),
        "sensor.engine_room_main_engine_me_alt_v": st(14.1, { unit_of_measurement: "V" }),
        "sensor.engine_room_main_engine_me_hours": st(1287),
        "sensor.al1590_er_prop_shaft_cooling_water_flow": st(4.2),
        "sensor.wago_hcs_controls_wago_hcs_controls_lever_position": st(35, { unit_of_measurement: "%" }),
        "sensor.wago_hcs_controls_wago_hcs_controls_speed_setpoint": st(1500),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_running": st("on"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_clutch_fwd": st("on"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_clutch_aft": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_emotor_clutch_in": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_clutch_ntr": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_lifebeat": st("on"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_emotor_running": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_mode": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_electric_mode": st("off"),
        "binary_sensor.er_thruster_status_bow_thruster_running": st("off"),
        "sensor.generator_gen_rpm": st(0, { unit_of_measurement: "rpm" }),
        "sensor.generator_gen_coolant_temp": st(31, { unit_of_measurement: "°C" }),
        "sensor.generator_gen_hours": st(642),
      };
      // Owners cabin (room panel on ship-deck): light groups with their members, Webasto with feedback.
      const ocGroups = {
        "light.owners_cabin_rondom_laag_plafond": ["light.oc_s_1b_laag_bba_d11", "light.oc_s_1b_laag_sba_d16", "light.oc_s_1b_laag_bbm_d10", "light.oc_s_1b_laag_sbm_d15", "light.oc_s_1b_laag_bbv_d9", "light.oc_s_1b_laag_sbv_d14"],
        "light.owners_cabin_plinten": ["light.oc_s_1b2_led_bed_d12", "light.oc_s_1b2_led_vloer_d8"],
        "light.owners_cabin_douche_ruimte": ["light.oc_s_2a_douche_d18_1", "light.oc_s_2a_wasbak_d17", "light.oc_s_2a_wc_d18"],
      };
      const lit = (on, pct = 60) => st(on ? "on" : "off", on ? { brightness: Math.round(pct * 2.55) } : {});
      for (const [g, ms] of Object.entries(ocGroups)) ms.forEach((m, i) => (states[m] = lit(g.endsWith("plafond") && i < 4, 60)));
      for (const id of ["light.oc_s_1b_kaptafel_d13", "light.oc_1c2", "light.oc_1c3"]) states[id] = lit(id.endsWith("d13"), 35);
      const syncGroups = () => {
        for (const [g, ms] of Object.entries(ocGroups)) {
          const on = ms.filter((m) => states[m]?.state === "on");
          const b = on.length ? Math.round(on.reduce((t, m) => t + (states[m].attributes.brightness ?? 255), 0) / on.length) : null;
          states[g] = st(on.length ? "on" : "off", { entity_id: ms, ...(b != null ? { brightness: b } : {}) });
        }
      };
      syncGroups();
      for (const id of ["switch.oc_e1_2_l1", "switch.oc_w_e3", "switch.oc_w_e4", "switch.oc_w_e5", "switch.oc_k1", "switch.0xa4c138b105c39a71"]) states[id] = st("on");
      for (const [k, t, sp, fan, ac] of [["owners_cabin", 17.7, 18, 3, "on"], ["owners_cabin_bad", 18.9, 22, 6, "off"]]) {
        const b = `webasto_bluecool_noder_${k}`;
        states[`sensor.${b}_temp`] = st(t, { unit_of_measurement: "°C" });
        states[`switch.${b}_ac`] = st(ac);
        states[`number.${b}`] = st(sp, { min: 16, max: 30, step: 1, unit_of_measurement: "°C" });
        states[`sensor.${b}_setpoint_feedback`] = st(sp, { unit_of_measurement: "°C" });
        states[`number.${b}_fan_speed`] = st(fan, { min: 1, max: 6, step: 1 });
        states[`sensor.${b}_fan_speed_feedback`] = st(fan);
      }
      for (const id of ["button.wago_hcs_controls_wago_controls_dieselmode", "button.wago_hcs_controls_wago_controls_electricmode", "button.plc_mode_generator", "button.wago_hcs_controls_wago_controls_harbormode", "button.wago_energy_controls_wago_energy_controls_reset_main_2"])
        states[id] = st("unknown");
      const el = document.createElement("shipborn-panel-card");
      const log = document.getElementById("log");
      const hass = {
        states,
        locale: { language: "nl" },
        callService(domain, service, data = {}) {
          log.textContent = `${domain}.${service} ${JSON.stringify(data)}`;
          // Lights, switches and numbers react like HA (feedback of a number after 1.5 s), so the room panels can be tried.
          const id = data.entity_id || "";
          const push = () => (el.hass = { ...hass, states: { ...states } });
          const setLight = (e, on, pct) => (states[e] = e.startsWith("light.") ? lit(on, pct ?? Math.round((states[e]?.attributes?.brightness ?? 153) / 2.55)) : st(on ? "on" : "off"));
          const targets = ocGroups[id] || [id];
          if (/^(homeassistant|light|switch)$/.test(domain) && /^turn_(on|off)$|^toggle$/.test(service) && states[id]) {
            const on = service === "toggle" ? states[id].state !== "on" : service === "turn_on";
            targets.forEach((e) => setLight(e, on, data.brightness_pct));
            syncGroups();
            setTimeout(push, 300);
          }
          if (domain === "number" && service === "set_value") {
            states[id] = st(data.value, states[id]?.attributes);
            const fb = id.replace(/^number\.(.*?)(_fan_speed)?$/, (m, b, f) => `sensor.${b}${f ? "_fan_speed" : "_setpoint"}_feedback`);
            setTimeout(() => { if (states[fb]) states[fb] = st(data.value, states[fb].attributes); push(); }, 1500);
            push();
          }
          const mode = /^button\.wago_hcs_controls_wago_controls_(diesel|electric|harbor)mode$/.exec(data.entity_id || "");
          if (mode) {
            for (const m of ["diesel", "electric", "harbor"]) states[`binary_sensor.wago_hcs_controls_wago_hcs_controls_${m}_mode`] = st(m === mode[1] ? "on" : "off");
            el.hass = { ...hass, states: { ...states } };
          }
        },
      };
      el.setConfig(cfg);
      document.getElementById("view").appendChild(el);
      el.hass = hass;

      // Simulation: one checkbox per entity that makes a pipe flow or a symbol light up.
      const conds = new Map();
      for (const it of cfg.items.filter((i) => i.type !== "alarm"))
        for (const key of ["flow", "active"]) {
          const ids = [].concat(it[key + "_entity"] || []);
          for (const id of ids) if (!conds.has(id)) conds.set(id, { above: it[key + "_above"], abs: it[key + "_abs"] });
        }
      const sim = document.getElementById("sim");
      for (const [id, c] of [...conds].sort()) {
        const lbl = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        const on = () => (c.above == null ? "on" : String((c.abs ? -1 : 1) * (c.above < 10 ? c.above + 12.3 : c.above + 1350)));
        const cur = states[id];
        box.checked = cur ? (c.above != null ? Math.abs(parseFloat(cur.state)) > c.above : cur.state === "on") : true;
        if (!cur || cur.state === "unknown") states[id] = st(box.checked ? on() : c.above != null ? 0 : "off");
        box.onchange = () => {
          states[id] = st(box.checked ? on() : c.above != null ? 0 : "off", states[id]?.attributes);
          el.hass = { ...hass, states: { ...states } };
        };
        lbl.append(box, " " + id.replace(/^(binary_)?sensor\.plc_/, ""));
        sim.appendChild(lbl);
      }
      el.hass = { ...hass, states: { ...states } };
    })();
  </script>
</body>
</html>
