<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLC dashboard demo</title>
  <style>
    body { margin: 0; padding-bottom: 120px; background: #0d0e10; font-family: sans-serif; } /* room for the fixed icon bar */
    #view { max-width: 1280px; margin: 0 auto; }
    #log { max-width: 1280px; margin: 8px auto; font: 12px monospace; color: #8f8e88; }
    #sim { max-width: 1280px; margin: 8px auto; display: flex; flex-wrap: wrap; gap: 6px 16px; font: 12px monospace; color: #cfcec8; }
    #sim label { cursor: pointer; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="../dist/shipborn-panel-card.js"></script>
</head>
<body>
  <div id="view"></div>
  <div id="sim"></div>
  <div id="log">Mock: service calls verschijnen hier (geen echte HA).</div>
  <script>
    // Tabs in the card navigate as in HA (/<dashboard>/<view>), which does not exist here: go to ?view=<view> instead.
    window.addEventListener("location-changed", () => {
      location.replace(`plc.html?view=${encodeURIComponent(location.pathname.split("/").pop())}`);
    });
    // Renders a view of examples/plc-dashboard.yaml (?view=<path>, default the first) with fake entity states.
    (async () => {
      const yaml = await (await fetch("../examples/plc-dashboard.yaml")).text();
      const views = jsyaml.load(yaml).views;
      const wanted = new URLSearchParams(location.search).get("view");
      const cfg = (views.find((v) => v.path === wanted) || views[0]).cards[0];
      const now = new Date().toISOString();
      const st = (state, attributes = {}) => ({ state: String(state), attributes, last_changed: now });
      const states = {
        "sensor.plc_active_alarm": st("026 Jetvalve 3 won't move to starboard"),
        "binary_sensor.plc_alarm_active": st("on"),
        "sensor.er_alarm_status_active_alarms": st(2, { alarms: ["Bilge engine room high", "Diesel PS level low"] }),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_harbor_mode": st("on"),
        "binary_sensor.plc_gear_neutral": st("on"),
        "sensor.engine_room_main_engine_me_rpm": st(1450, { unit_of_measurement: "rpm" }),
        "sensor.wago_hcs_controls_wago_hcs_controls_emotor_speed": st(1200, { unit_of_measurement: "rpm" }),
        "sensor.wago_hcs_controls_wago_hcs_controls_shaft_speed": st(180, { unit_of_measurement: "rpm" }),
        "sensor.wago_energy_controls_wago_energy_controls_bms_state_of_charge": st(72, { unit_of_measurement: "%" }),
        "binary_sensor.plc_battery_discharging": st("on"),
        "sensor.engine_room_main_engine_me_coolant_temp": st(82, { unit_of_measurement: "°C" }),
        "sensor.wago_values_er_diesel_daytank_level_statistics": st(64, { unit_of_measurement: "%" }),
        "sensor.al1590_er_prop_shaft_grease_pressure": st(0.45),
        "sensor.al1590_er_prop_shaft_grease_temperature": st(21.4),
        "sensor.al1590_er_volvo_exhaust_temperature": st(48.2),
        "sensor.al1590_er_volvo_seawater_cooling_flow": st(38.5),
        "switch.er_zeewaterpomp_cooling": st("on"),
        // Tank levels in %, and the compressor pressure in bar, as in HA.
        "sensor.wago_values_er_diesel_ps_level": st(79),
        "sensor.wago_plc_er_diesel_sb_level": st(51),
        "sensor.wago_values_aft_diesel_webasto_level_statistics": st(41, { unit_of_measurement: "%" }),
        "sensor.wago_values_lr_fresh_water_level": st(66),
        "sensor.wago_values_er_dirtywater_level": st(22),
        "input_number.tank_vul_level": st(80, { min: 0, max: 100, step: 5, unit_of_measurement: "%" }),
        "automation.zoetwater_vul_automaat": st("on"),
        "automation.vuilwater_leeg_automaat": st("on"),
        "automation.clycolpomponautomaat": st("on"),
        "automation.glycolpomp_uit_bij_lage_drivetemperatuur_en_dc_bus_uit": st("on"),
        "automation.zeewaterpomp_aan_bij_hoge_drivetemperatuur": st("on"),
        "automation.zeewaterpomp_uit_glycol_34gr": st("off"),
        "switch.0x781c9dfffeb6cfcd": st("on"),
        "sensor.al1590_er_compressor_manifold_pressure": st(6.475, { unit_of_measurement: "bar" }),
        // Voortstuwing (design: tc90).
        "binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_on": st("on"),
        // Energy Inverters: scripts + status (gesimuleerd in callService; ?ei_fail=shore laat die stap niet reageren (&ei_speed=10 = timeout na 2 s; window.eiRespond() = toch reactie))
        "input_text.energy_inverters_status": st(""),
        "select.webasto_bluecool_connect_compressor_engine_room_operation_mode": st("F2 Heating", { options: ["F1 Cooling", "F2 Heating", "F5 Heating with ext. heater", "F7 Dehumidification"] }),
        "sensor.webasto_bluecool_connect_compressor_engine_room_operation_mode_feedback": st("F2 Heating"),
        "script.energy_inverters_opstarten": st("off"),
        "script.energy_inverters_afsluiten": st("off"),
        // Generator opstarten: script + status (gesimuleerd in callService, zelfde stappen als generated automations/generator_opstarten.yaml;
        // ?gen_fail=gen laat die stap niet reageren (&gen_speed=10 = timeout sneller; window.genRespond() = toch reactie))
        "input_text.generator_opstarten_status": st(""),
        "script.generator_opstarten": st("off"),
        "script.generator_afsluiten": st("off"),
        "valve.er_ventielblok_1tm4_l1": st("closed"),
        "valve.er_ventielblok_1tm4_l2": st("closed"),
        "valve.er_ventielblok_1tm4_l3": st("closed"),
        "valve.er_ventielblok_1tm4_l4": st("closed"),
        "switch.0x781c9dfffea18853": st("off"),
        // Diesel opstarten: script + status (gesimuleerd in callService); ?diesel_off=1 = motor staat nog uit, ?diesel_fail=vaar = geen reactie
        "input_text.diesel_opstarten_status": st(""),
        "script.diesel_opstarten": st("off"),
        "script.diesel_stoppen": st("off"),
        "script.vaarmodus_elektrisch": st("off"),
        "binary_sensor.diesel_contact": st("on"), // contact van de Volvo (generated automations/diesel_contact.yaml) // ?dc_off=1 = DC-bus staat uit
        "input_text.vaarmodus_elektrisch_status": st(""),
        "script.vaarmodus_kiezen": st("off"),
        "input_select.vaarmodus_haven": st("Haven"),
        "switch.wago_energy_controls_wago_energy_controls_charge_batteries_2": st("on"),
        "switch.wago_energy_controls_wago_energy_controls_manual_start_aux_generator_2": st("off"),
        "switch.wago_energy_controls_wago_energy_controls_shore_supply_2": st("on"),
        "switch.wago_energy_controls_wago_energy_controls_generator_2": st("off"),
        "binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_on": st("off"),
        "binary_sensor.wago_energy_controls_wago_energy_controls_bms_charging_mode": st("off"),
        "binary_sensor.wago_energy_controls_wago_energy_controls_bms_is_on": st("off"),
        "binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_connected": st("off"),
        "binary_sensor.wago_energy_controls_wago_energy_controls_generator_is_connected": st("off"),
        "sensor.engine_room_me_oil_press": st(3.4, { unit_of_measurement: "bar" }),
        "sensor.main_engine_oil_temp": st(92, { unit_of_measurement: "°C" }),
        "sensor.engine_room_main_engine_me_alt_v": st(14.1, { unit_of_measurement: "V" }),
        "sensor.engine_room_main_engine_me_hours": st(1287),
        "sensor.al1590_er_prop_shaft_cooling_water_flow": st(4.2),
        "sensor.wago_hcs_controls_wago_hcs_controls_lever_position": st(35, { unit_of_measurement: "%" }),
        "sensor.wago_hcs_controls_wago_hcs_controls_speed_setpoint": st(1500),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_running": st("on"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_clutch_fwd": st("on"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_clutch_aft": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_emotor_clutch_in": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_clutch_ntr": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_lifebeat": st("on"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_emotor_running": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_mode": st("off"),
        "binary_sensor.wago_hcs_controls_wago_hcs_controls_electric_mode": st("off"),
        "binary_sensor.er_thruster_status_bow_thruster_running": st("off"),
        "sensor.generator_gen_rpm": st(0, { unit_of_measurement: "rpm" }),
        "sensor.generator_gen_coolant_temp": st(31, { unit_of_measurement: "°C" }),
        "sensor.generator_gen_hours": st(642),
      };
      // Owners cabin (room panel on ship-deck): light groups with their members, Webasto with feedback.
      const ocGroups = {
        "light.owners_cabin_rondom_laag_plafond": ["light.oc_s_1b_laag_bba_d11", "light.oc_s_1b_laag_sba_d16", "light.oc_s_1b_laag_bbm_d10", "light.oc_s_1b_laag_sbm_d15", "light.oc_s_1b_laag_bbv_d9", "light.oc_s_1b_laag_sbv_d14"],
        "light.owners_cabin_plinten": ["light.oc_s_1b2_led_bed_d12", "light.oc_s_1b2_led_vloer_d8"],
        "light.owners_cabin_douche_ruimte": ["light.oc_s_2a_douche_d18_1", "light.oc_s_2a_wasbak_d17", "light.oc_s_2a_wc_d18"],
      };
      const lit = (on, pct = 60) => st(on ? "on" : "off", on ? { brightness: Math.round(pct * 2.55) } : {});
      for (const [g, ms] of Object.entries(ocGroups)) ms.forEach((m, i) => (states[m] = lit(g.endsWith("plafond") && i < 4, 60)));
      for (const id of ["light.oc_s_1b_kaptafel_d13", "light.oc_1c2", "light.oc_1c3"]) states[id] = lit(id.endsWith("d13"), 35);
      const syncGroups = () => {
        for (const [g, ms] of Object.entries(ocGroups)) {
          const on = ms.filter((m) => states[m]?.state === "on");
          const b = on.length ? Math.round(on.reduce((t, m) => t + (states[m].attributes.brightness ?? 255), 0) / on.length) : null;
          states[g] = st(on.length ? "on" : "off", { entity_id: ms, ...(b != null ? { brightness: b } : {}) });
        }
      };
      syncGroups();
      // Ankeren (ship-anchor): waarden die nog niet in de demo stonden
      for (const [id, s] of [["sensor.wago_values_drivepower_maingrit", st(2.3, { unit_of_measurement: "kW" })], ["sensor.er_pms_status2_bms_max_soc", st(90, { unit_of_measurement: "%" })],
        ["binary_sensor.generatoron", st("off")], ["switch.lopolight_navigation_lights_navlight_anchor", st("on")], ["switch.lopolight_navigation_lights_navlight_stern", st("off")],
        ["sensor.wago_values_er_diesel_daytank_level", st(64, { unit_of_measurement: "%" })], ["sensor.wago_values_aft_diesel_webasto_level", st(18, { unit_of_measurement: "%" })]])
        if (!states[id]) states[id] = s;
      // Webasto: airco-status, koudwatertemperatuur en foutcode per unit (Klimaat › Instellingen)
      for (const [k, ac, cw, err] of [["compressor_engine_room", "on", 7.4, "OK"], ["crew_cabin", "off", 7.9, "OK"], ["deck_lounge", "on", 8.1, "OK"], ["galley", "off", 8.0, "OK"],
        ["guest_cabin", "on", 7.6, "OK"], ["main_cabin", "on", 7.7, "A02"], ["owners_cabin", "on", 7.5, "OK"], ["owners_cabin_bad", "off", 7.8, "bA11"]]) {
        states[`binary_sensor.webasto_bluecool_noder_${k}_ac_status`] = st(ac);
        states[`sensor.webasto_bluecool_connect_${k}_cold_water_temperature`] = st(cw, { unit_of_measurement: "°C" });
        states[`sensor.webasto_bluecool_connect_${k}_error_code`] = st(err);
      }
      for (const id of ["switch.oc_e1_2_l1", "switch.oc_w_e3", "switch.oc_w_e4", "switch.oc_w_e5", "switch.oc_k1", "switch.0xa4c138b105c39a71"]) states[id] = st("on");
      for (const [k, t, sp, fan, ac] of [["owners_cabin", 17.7, 18, 3, "on"], ["owners_cabin_bad", 18.9, 22, 6, "off"]]) {
        const b = `webasto_bluecool_noder_${k}`;
        states[`sensor.${b}_temp`] = st(t, { unit_of_measurement: "°C" });
        states[`switch.${b}_ac`] = st(ac);
        states[`number.${b}`] = st(sp, { min: 16, max: 30, step: 1, unit_of_measurement: "°C" });
        states[`sensor.${b}_setpoint_feedback`] = st(sp, { unit_of_measurement: "°C" });
        states[`number.${b}_fan_speed`] = st(fan, { min: 1, max: 6, step: 1 });
        states[`sensor.${b}_fan_speed_feedback`] = st(fan);
      }
      for (const id of ["button.wago_hcs_controls_wago_controls_dieselmode", "button.wago_hcs_controls_wago_controls_electricmode", "button.plc_mode_generator", "button.wago_hcs_controls_wago_controls_harbormode", "button.wago_energy_controls_wago_energy_controls_reset_main_2"])
        states[id] = st("unknown");
      const el = document.createElement("shipborn-panel-card");
      const log = document.getElementById("log");
      const hass = {
        states,
        locale: { language: "nl" },
        callService(domain, service, data = {}) {
          log.textContent = `${domain}.${service} ${JSON.stringify(data)}`;
          // Lights, switches and numbers react like HA (feedback of a number after 1.5 s), so the room panels can be tried.
          const id = data.entity_id || "";
          const push = () => (el.hass = { ...hass, states: { ...states } });
          const setLight = (e, on, pct) => (states[e] = e.startsWith("light.") ? lit(on, pct ?? Math.round((states[e]?.attributes?.brightness ?? 153) / 2.55)) : st(on ? "on" : "off"));
          const targets = ocGroups[id] || [id];
          if (/^(homeassistant|light|switch)$/.test(domain) && /^turn_(on|off)$|^toggle$/.test(service) && states[id]) {
            const on = service === "toggle" ? states[id].state !== "on" : service === "turn_on";
            targets.forEach((e) => setLight(e, on, data.brightness_pct));
            syncGroups();
            setTimeout(push, 300);
          }
          if (domain === "number" && service === "set_value") {
            states[id] = st(data.value, states[id]?.attributes);
            const fb = id.replace(/^number\.(.*?)(_fan_speed)?$/, (m, b, f) => `sensor.${b}${f ? "_fan_speed" : "_setpoint"}_feedback`);
            setTimeout(() => { if (states[fb]) states[fb] = st(data.value, states[fb].attributes); push(); }, 1500);
            push();
          }
          // Energy Inverters scripts: same steps as generated automations/energy_inverters.yaml, 1.2 s per drive
          const eiScript = /^script\.energy_inverters_(opstarten|afsluiten)$/.exec(id);
          if (domain === "script" && service === "turn_on" && eiScript && states[id].state !== "on") {
            const E = "wago_energy_controls_wago_energy_controls_";
            const conn = { battery: `binary_sensor.${E}bms_is_on`, shore: `binary_sensor.${E}shore_supply_is_connected`, generator: `binary_sensor.${E}generator_is_connected` };
            const fail = new URLSearchParams(location.search).get("ei_fail");
            const on = eiScript[1] === "opstarten";
            const bron = data.variables?.bron || "battery";
            const steps = on ? (bron === "battery" ? ["battery"] : ["battery", bron])
              : [...["shore", "generator"].filter((k) => states[conn[k]].state === "on"), "battery"];
            const plan = ["lad_uit", ...steps];
            const laden = `switch.${E}charge_batteries_2`;
            const set = (v) => { states["input_text.energy_inverters_status"] = st(v); push(); };
            states[id] = st("on");
            (async () => {
              const wait = (ms) => new Promise((r) => setTimeout(r, ms));
              const want = on ? "on" : "off";
              // Charge batteries must be off first; wait for it (button Uitzetten) or for abort
              if (states[laden]?.state === "on") {
                set(`${plan}:lad_uit:fix`);
                while (states[laden].state === "on" && states["input_text.energy_inverters_status"].state !== `${plan}:lad_uit:abort`) await wait(200);
                if (states[laden].state === "on") { set(`${plan}:lad_uit:aborted`); states[id] = st("off"); return push(); }
              }
              for (const [i, k] of steps.entries()) {
                set(`${plan}:${k}:busy`);
                if (fail === k) {
                  await wait(20000 / (+new URLSearchParams(location.search).get("ei_speed") || 1));
                  set(`${plan}:${k}:timeout`);
                  // keep waiting until the feedback comes (window.eiRespond()) or the card asks for a rollback
                  let respond = false;
                  window.eiRespond = () => { respond = true; };
                  while (!respond && states["input_text.energy_inverters_status"].state !== `${plan}:${k}:rollback`) await wait(200);
                  if (!respond) {
                    set(`${plan}:${k}:rolling_back`);
                    await wait(800);
                    for (const j of steps.slice(0, i + 1).reverse()) { states[conn[j]] = st(on ? "off" : "on"); if (j === "battery") states["sensor.wago_energy_controls_wago_energy_controls_dc_bus_voltage"] = st(on ? 0 : 760, { unit_of_measurement: "V" }); }
                    set(`${plan}:${k}:rolled_back`);
                    states[id] = st("off");
                    return push();
                  }
                }
                await wait(1200);
                states[conn[k]] = st(want);
                if (k === "battery") states["sensor.wago_energy_controls_wago_energy_controls_dc_bus_voltage"] = st(on ? 760 : 0, { unit_of_measurement: "V" });
              }
              set(`${plan}::complete`);
              states[id] = st("off");
              push();
            })();
          }
          // Generator opstarten: same steps as generated automations/generator_opstarten.yaml (shorter waits)
          if (domain === "script" && service === "turn_on" && id === "script.generator_opstarten" && states[id].state !== "on") {
            const E = "wago_energy_controls_wago_energy_controls_";
            const S = "input_text.generator_opstarten_status";
            const q = new URLSearchParams(location.search);
            const plan = "main,wierpot,dc,lad_uit,omv,start,wal_uit,gen,laden";
            const sw = { start: `switch.${E}manual_start_aux_generator_2`, wal_uit: `switch.${E}shore_supply_2`, gen: `switch.${E}generator_2`, laden: `switch.${E}charge_batteries_2` };
            const fb = { start: `binary_sensor.${E}generator_is_on`, wal_uit: `binary_sensor.${E}shore_supply_is_connected`, gen: `binary_sensor.${E}generator_is_connected`, laden: `binary_sensor.${E}bms_charging_mode` };
            const aan = { start: true, wal_uit: false, gen: true, laden: true };
            const tmo = { start: 60, wal_uit: 20, gen: 20, laden: 20 };
            const is = (e, v) => states[e]?.state === v;
            const now = () => states[S].state;
            const set = (v) => { states[S] = st(v); push(); };
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            const until = async (fn, ms = Infinity) => { const t = Date.now(); while (!fn()) { if (Date.now() - t > ms) return false; await wait(200); } return true; };
            const end = () => { states[id] = st("off"); push(); };
            states[id] = st("on");
            // a switch in the demo: the feedback follows its switch after 1.2 s (generator start after 3 s), unless ?gen_fail=<step>
            const drive = (k, on) => { states[sw[k]] = st(on ? "on" : "off"); push(); if (q.get("gen_fail") !== k) setTimeout(() => { states[fb[k]] = st(on ? "on" : "off"); push(); }, k === "start" ? 3000 : 1200); };
            (async () => {
              const ask = async (k, answers) => { set(`${plan}:${k}:confirm`); await until(() => answers.some((a) => now() === `${plan}:${k}:${a}`)); return now().split(":")[2]; };
              const check = async (k, ok) => { if (ok()) return true; set(`${plan}:${k}:fix`); await until(() => ok() || now() === `${plan}:${k}:abort`); return ok(); };
              const abort = (k) => { set(`${plan}:${k}:aborted`); end(); };
              if ((await ask("main", ["done", "abort"])) === "abort") return abort("main");
              if (!(await check("wierpot", () => is("valve.er_ventielblok_1tm4_l1", "open")))) return abort("wierpot");
              if (!(await check("dc", () => +states[`sensor.${E}dc_bus_voltage`]?.state >= 700))) return abort("dc");
              if (!(await check("lad_uit", () => is(sw.laden, "off")))) return abort("lad_uit");
              if ((await ask("omv", ["done", "abort"])) === "abort") return abort("omv");
              let keuze = "al_aan";
              if (!is(fb.start, "on")) {
                keuze = await ask("start", ["ha", "manual", "abort"]);
                if (keuze === "abort") return abort("start");
              }
              if (keuze === "manual") {
                set(`${plan}:start:manual`);
                setTimeout(() => { states[fb.start] = st("on"); push(); }, 4000); // the operator starts it at the panel
                await until(() => is(fb.start, "on") || now() === `${plan}:start:abort`);
                if (!is(fb.start, "on")) return abort("start");
                set(`${plan}:start:ok`);
                await wait(2000);
              }
              const steps = [...(keuze === "ha" ? ["start"] : []), "wal_uit", "gen", "laden"].filter((k) => {
                const d = aan[k] ? "on" : "off";
                return !is(sw[k], d) || !is(fb[k], d);
              });
              for (const [i, k] of steps.entries()) {
                const d = aan[k] ? "on" : "off";
                set(`${plan}:${k}:busy`);
                drive(k, aan[k]);
                if (!(await until(() => is(fb[k], d), (tmo[k] * 1000) / (+q.get("gen_speed") || 1)))) {
                  set(`${plan}:${k}:timeout`);
                  window.genRespond = () => { states[fb[k]] = st(d); push(); };
                  await until(() => is(fb[k], d) || now() === `${plan}:${k}:rollback`);
                  if (!is(fb[k], d)) {
                    set(`${plan}:${k}:rolling_back`);
                    await wait(800);
                    for (const j of steps.slice(0, i + 1).reverse()) { states[sw[j]] = st(aan[j] ? "off" : "on"); states[fb[j]] = st(aan[j] ? "off" : "on"); }
                    set(`${plan}:${k}:rolled_back`);
                    return end();
                  }
                }
                set(`${plan}:${k}:ok`);
                await wait(2000);
              }
              set(`${plan}::complete`);
              end();
            })();
          }
          // Generator afsluiten: same steps as generated automations/generator_afsluiten.yaml (shorter waits; ?gen_fail=<step> works here too)
          if (domain === "script" && service === "turn_on" && id === "script.generator_afsluiten" && states[id].state !== "on") {
            const E = "wago_energy_controls_wago_energy_controls_";
            const S = "input_text.generator_opstarten_status";
            const q = new URLSearchParams(location.search);
            const plan = "wal,lad_uit,accu,gen_uit,stop,wal_aan";
            const sw = { gen_uit: `switch.${E}generator_2`, stop: `switch.${E}manual_start_aux_generator_2`, wal_aan: `switch.${E}shore_supply_2` };
            const fb = { gen_uit: `binary_sensor.${E}generator_is_connected`, stop: `binary_sensor.${E}generator_is_on`, wal_aan: `binary_sensor.${E}shore_supply_is_connected` };
            const aan = { gen_uit: false, stop: false, wal_aan: true };
            const tmo = { gen_uit: 20, stop: 60, wal_aan: 20 };
            const is = (e, v) => states[e]?.state === v;
            const now = () => states[S].state;
            const set = (v) => { states[S] = st(v); push(); };
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            const until = async (fn, ms = Infinity) => { const t = Date.now(); while (!fn()) { if (Date.now() - t > ms) return false; await wait(200); } return true; };
            const end = () => { states[id] = st("off"); push(); };
            states[id] = st("on");
            const drive = (k, on) => { states[sw[k]] = st(on ? "on" : "off"); push(); if (q.get("gen_fail") !== k) setTimeout(() => { states[fb[k]] = st(on ? "on" : "off"); push(); }, k === "stop" ? 3000 : 1200); };
            (async () => {
              const check = async (k, ok) => { if (ok()) return true; set(`${plan}:${k}:fix`); await until(() => ok() || now() === `${plan}:${k}:abort`); return ok(); };
              const abort = (k) => { set(`${plan}:${k}:aborted`); end(); };
              if (!(await check("wal", () => is(`binary_sensor.${E}shore_supply_is_on`, "on")))) return abort("wal");
              if (!(await check("lad_uit", () => is(`switch.${E}charge_batteries_2`, "off")))) return abort("lad_uit");
              // demo: the Koppelen button only switches battery_connect_2, so that counts as connected too
              if (!(await check("accu", () => is(`binary_sensor.${E}bms_is_on`, "on") || is(`switch.${E}battery_connect_2`, "on")))) return abort("accu");
              const steps = ["gen_uit", "stop", "wal_aan"].filter((k) => { const d = aan[k] ? "on" : "off"; return !is(sw[k], d) || !is(fb[k], d); });
              for (const [i, k] of steps.entries()) {
                const d = aan[k] ? "on" : "off";
                set(`${plan}:${k}:busy`);
                drive(k, aan[k]);
                if (!(await until(() => is(fb[k], d), (tmo[k] * 1000) / (+q.get("gen_speed") || 1)))) {
                  set(`${plan}:${k}:timeout`);
                  window.genRespond = () => { states[fb[k]] = st(d); push(); };
                  await until(() => is(fb[k], d) || now() === `${plan}:${k}:rollback`);
                  if (!is(fb[k], d)) {
                    set(`${plan}:${k}:rolling_back`);
                    await wait(800);
                    for (const j of steps.slice(0, i + 1).reverse()) { states[sw[j]] = st(aan[j] ? "off" : "on"); states[fb[j]] = st(aan[j] ? "off" : "on"); }
                    set(`${plan}:${k}:rolled_back`);
                    return end();
                  }
                }
                set(`${plan}:${k}:ok`);
                await wait(2000);
              }
              set(`${plan}::complete`);
              end();
            })();
          }
          if (new URLSearchParams(location.search).get("dc_off") && !window.__dcOff) { window.__dcOff = true; states["sensor.wago_energy_controls_wago_energy_controls_dc_bus_voltage"] = st(0, { unit_of_measurement: "V" }); }
          // Vaarmodus: Haven / Anker / Zeilen are all harbor mode on the PLC (generated automations/vaarmodus.yaml)
          window.__pressMode = (m) => {
            for (const x of ["diesel", "electric", "harbor"]) states[`binary_sensor.wago_hcs_controls_wago_hcs_controls_${x}_mode`] = st(x === m ? "on" : "off");
            if (m !== "harbor") states["input_select.vaarmodus_haven"] = st("Geen");
            else if (states["input_select.vaarmodus_haven"].state === "Geen") states["input_select.vaarmodus_haven"] = st("Haven");
            el.hass = { ...hass, states: { ...states } };
          };
          window.__kiesModus = (m) => { states["input_select.vaarmodus_haven"] = st(m); window.__pressMode("harbor"); };
          if (domain === "script" && service === "turn_on" && id === "script.vaarmodus_kiezen") window.__kiesModus(data.variables?.modus || "Haven");
          if (domain === "valve" && service === "close_valve") { for (const v of [].concat(data.entity_id)) states[v] = st("closed"); el.hass = { ...hass, states: { ...states } }; }
          // Vaarmodus elektrisch: same steps as generated automations/vaarmodus.yaml (shorter waits)
          if (domain === "script" && service === "turn_on" && id === "script.vaarmodus_elektrisch" && states[id].state !== "on") {
            const S = "input_text.vaarmodus_elektrisch_status", plan = "dc,modus";
            const bus = () => +states["sensor.wago_energy_controls_wago_energy_controls_dc_bus_voltage"].state || 0;
            const set = (v) => { states[S] = st(v); el.hass = { ...hass, states: { ...states } }; };
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            const end = () => { states[id] = st("off"); el.hass = { ...hass, states: { ...states } }; };
            states[id] = st("on");
            (async () => {
              if (bus() < 700) {
                set(`${plan}:dc:fix`);
                while (bus() < 700 && states[S].state !== `${plan}:dc:abort`) await wait(200);
                if (bus() < 700) { set(`${plan}:dc:aborted`); return end(); }
                set(`${plan}:dc:ok`); await wait(1000);
              }
              set(`${plan}:modus:busy`); await wait(800);
              window.__pressMode("electric");
              set(`${plan}::complete`); end();
            })();
          }
          // Stop Diesel: same steps as generated automations/diesel_stoppen.yaml (shorter waits)
          if (domain === "script" && service === "turn_on" && id === "script.diesel_stoppen" && states[id].state !== "on") {
            const S = "input_text.diesel_opstarten_status";
            const plan = "stop,modus,contact";
            const run = "binary_sensor.wago_hcs_controls_wago_hcs_controls_diesel_running", rpm = "sensor.engine_room_main_engine_me_rpm";
            const now = () => states[S].state;
            const set = (v) => { states[S] = st(v); el.hass = { ...hass, states: { ...states } }; };
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            const until = async (fn) => { while (!fn()) await wait(200); };
            const end = () => { states[id] = st("off"); el.hass = { ...hass, states: { ...states } }; };
            const isAb = (k) => now() === `${plan}:${k}:abort`;
            const abort = (k) => { set(`${plan}:${k}:aborted`); end(); };
            const off = () => states[run].state === "off" && +states[rpm].state < 50;
            states[id] = st("on");
            (async () => {
              if (!off()) {
                set(`${plan}:stop:manual`);
                setTimeout(() => { if (!isAb("stop")) { states[run] = st("off"); states[rpm] = st(0); el.hass = { ...hass, states: { ...states } }; } }, 3000);
                await until(() => off() || isAb("stop"));
                if (isAb("stop")) return abort("stop");
                set(`${plan}:stop:ok`); await wait(2000);
              }
              set(`${plan}:modus:confirm`);
              await until(() => ["elektrisch", "haven", "anker", "zeilen", "abort"].some((k) => now() === `${plan}:modus:${k}`));
              const k = now().split(":")[2];
              if (k === "abort") return abort("modus");
              const bus = () => +states["sensor.wago_energy_controls_wago_energy_controls_dc_bus_voltage"].state || 0;
              if (k === "elektrisch" && bus() < 700) {
                set(`${plan}:modus:dc`);
                await until(() => bus() >= 700 || isAb("modus"));
                if (isAb("modus")) return abort("modus");
              }
              set(`${plan}:modus:busy`);
              await wait(800);
              if (k === "elektrisch") window.__pressMode("electric");
              else window.__kiesModus(k[0].toUpperCase() + k.slice(1));
              set(`${plan}:modus:ok`); await wait(2000);
              const contactUit = k === "haven" || k === "anker";
              if (contactUit) {
                set(`${plan}:contact:confirm`);
                // contact goes off after 3 s (no engine data any more)
                setTimeout(() => { if (!isAb("contact")) { states["binary_sensor.diesel_contact"] = st("off"); el.hass = { ...hass, states: { ...states } }; } }, 3000);
                await until(() => states["binary_sensor.diesel_contact"].state === "off" || now() === `${plan}:contact:done` || isAb("contact"));
                if (isAb("contact")) return abort("contact");
              }
              set(`${contactUit ? plan : "stop,modus"}::complete`);
              end();
            })();
          }
          // Diesel opstarten: same steps as generated automations/diesel_opstarten.yaml (shorter waits)
          if (domain === "script" && service === "turn_on" && id === "script.diesel_opstarten" && states[id].state !== "on") {
            const H = "wago_hcs_controls_wago_hcs_controls_";
            const S = "input_text.diesel_opstarten_status";
            const q = new URLSearchParams(location.search);
            const plan = "prep,motor,nood,hendel,vaar";
            const V = [2, 3, 4].map((n) => `valve.er_ventielblok_1tm4_l${n}`); // inlaat, uitlaat, wierpot aft (front is voor de generator)
            const P = ["switch.er_zeewaterpomp_cooling", "switch.0x781c9dfffea18853"];
            const run = `binary_sensor.${H}diesel_running`, mode = `binary_sensor.${H}diesel_mode`;
            const is = (e, v) => states[e]?.state === v;
            const now = () => states[S].state;
            const set = (v) => { states[S] = st(v); push(); };
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            const until = async (fn, ms = Infinity) => { const t = Date.now(); while (!fn()) { if (Date.now() - t > ms) return false; await wait(200); } return true; };
            const end = () => { states[id] = st("off"); push(); };
            const abort = (k) => { set(`${plan}:${k}:aborted`); end(); };
            const isAb = (k) => now() === `${plan}:${k}:abort`;
            const ready = () => V.every((v) => is(v, "open")) && P.every((x) => is(x, "on")) && +states["sensor.al1590_er_prop_shaft_cooling_water_flow"].state >= 2.5 && +states["sensor.al1590_er_compressor_manifold_pressure"].state >= 3;
            if (q.get("diesel_off") && !window.__dieselOff) { window.__dieselOff = true; states[run] = st("off"); states["binary_sensor.diesel_contact"] = st("off"); states["sensor.engine_room_main_engine_me_rpm"] = st(0); }
            states[id] = st("on");
            (async () => {
              if (!ready()) {
                set(`${plan}:prep:fix`);
                await until(() => ready() || isAb("prep") || now() === `${plan}:prep:start`);
                if (isAb("prep")) return abort("prep");
                if (now() === `${plan}:prep:start`) {
                  set(`${plan}:prep:wacht`);
                  [...V, ...P].forEach((e, i) => setTimeout(() => { states[e] = st(e.startsWith("valve") ? "open" : "on"); push(); }, 300 * (i + 1)));
                  await until(() => ready() || isAb("prep"));
                  if (isAb("prep")) return abort("prep");
                }
                set(`${plan}:prep:ok`); await wait(2000);
              }
              if (!is(run, "on")) {
                set(`${plan}:motor:manual`);
                setTimeout(() => { if (!isAb("motor")) { states[run] = st("on"); states["binary_sensor.diesel_contact"] = st("on"); states["sensor.engine_room_main_engine_me_rpm"] = st(1450); push(); } }, q.get("diesel_slow") ? 60000 : 3000);
                await until(() => is(run, "on") || isAb("motor"));
                if (isAb("motor")) return abort("motor");
                set(`${plan}:motor:ok`); await wait(2000);
              }
              // ?estop=1: alarm 001 Emergency Stop is active (gone after Alarmen resetten); window.__lever(v) moves the lever
              const AL = "sensor.er_alarm_status_active_alarms", LEV = `sensor.${H}lever_position`;
              const setAlarms = (list) => { states[AL] = st(list.length, { alarms: list }); push(); };
              const alarms = () => [].concat(states[AL].attributes.alarms || []);
              const nood = () => alarms().join(" | ").toLowerCase().includes("001 emergency stop");
              window.__lever = (v) => { states[LEV] = st(v, { unit_of_measurement: "%" }); push(); };
              if (q.get("estop") && !nood()) setAlarms([...alarms(), "001 Emergency Stop"]);
              if (nood()) {
                set(`${plan}:nood:confirm`);
                window.__resetAlarms = () => setAlarms(alarms().filter((a) => !/001 emergency stop/i.test(a)));
                await until(() => !nood() || isAb("nood"));
                if (isAb("nood")) return abort("nood");
                set(`${plan}:nood:ok`); await wait(2000);
              }
              const afw = () => Math.abs(+states[LEV].state);
              set(`${plan}:hendel:confirm`);
              await until(() => now() === `${plan}:hendel:door` || isAb("hendel"));
              if (isAb("hendel")) return abort("hendel");
              if (afw() > 4) {
                let first = true;
                for (;;) {
                  set(`${plan}:hendel:${first ? "cyclus" : "cyclus2"}`); first = false;
                  await until(() => now() === `${plan}:hendel:door` || isAb("hendel"));
                  if (isAb("hendel")) return abort("hendel");
                  if (afw() < 5) break;
                }
              }
              set(`${plan}:hendel:ok`); await wait(1000);
              if (!is(mode, "on")) {
                let first = true, klaar = false;
                while (!klaar && !isAb("vaar")) {
                  set(`${plan}:vaar:${first ? "confirm" : "opnieuw"}`); first = false;
                  await until(() => is(mode, "on") || isAb("vaar") || ["diesel", "zeilen", "anker"].some((k) => now() === `${plan}:vaar:${k}`));
                  const k = now().split(":")[2];
                  if (k === "diesel") {
                    set(`${plan}:vaar:busy`);
                    if (q.get("diesel_fail") !== "vaar") setTimeout(() => window.__pressMode("diesel"), 1000);
                    await until(() => is(mode, "on"), 20000 / (+q.get("gen_speed") || 1));
                    klaar = is(mode, "on");
                  } else if (k === "zeilen" || k === "anker") {
                    set(`${plan}:vaar:busy`);
                    await wait(800);
                    window.__kiesModus(k[0].toUpperCase() + k.slice(1));
                    klaar = true;
                  } else if (is(mode, "on")) klaar = true;
                }
                if (isAb("vaar")) return abort("vaar");
                set(`${plan}:vaar:ok`); await wait(2000);
              }
              set(`${plan}::complete`);
              end();
            })();
          }
          if (domain === "valve" && service === "open_valve" && states[id]) { states[id] = st("open"); push(); }
          if (domain === "input_text" && service === "set_value" && states[id]) { states[id] = st(data.value); push(); }
          // select: option set at once, a "<select>_feedback" sensor follows after 1 s (like the Webasto compressor mode)
          if (domain === "select" && service === "select_option" && states[id]) {
            states[id] = st(data.option, states[id].attributes);
            const fb = id.replace(/^select\./, "sensor.") + "_feedback";
            setTimeout(() => { if (states[fb]) states[fb] = st(data.option); push(); }, 1000);
            push();
          }
          if (domain === "button" && data.entity_id === "button.wago_energy_controls_wago_energy_controls_reset_main_2") window.__resetAlarms?.();
          const mode = /^button\.wago_hcs_controls_wago_controls_(diesel|electric|harbor)mode$/.exec(data.entity_id || "");
          if (mode) {
            window.__pressMode(mode[1]);
          }
        },
      };
      el.setConfig(cfg);
      document.getElementById("view").appendChild(el);
      el.hass = hass;

      // Simulation: one checkbox per entity that makes a pipe flow or a symbol light up.
      const conds = new Map();
      for (const it of cfg.items.filter((i) => i.type !== "alarm"))
        for (const key of ["flow", "active"]) {
          const ids = [].concat(it[key + "_entity"] || []);
          for (const id of ids) if (!conds.has(id)) conds.set(id, { above: it[key + "_above"], abs: it[key + "_abs"] });
        }
      const sim = document.getElementById("sim");
      for (const [id, c] of [...conds].sort()) {
        const lbl = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        const on = () => (c.above == null ? "on" : String((c.abs ? -1 : 1) * (c.above < 10 ? c.above + 12.3 : c.above + 1350)));
        const cur = states[id];
        box.checked = cur ? (c.above != null ? Math.abs(parseFloat(cur.state)) > c.above : cur.state === "on") : true;
        if (!cur || cur.state === "unknown") states[id] = st(box.checked ? on() : c.above != null ? 0 : "off");
        box.onchange = () => {
          states[id] = st(box.checked ? on() : c.above != null ? 0 : "off", states[id]?.attributes);
          el.hass = { ...hass, states: { ...states } };
        };
        lbl.append(box, " " + id.replace(/^(binary_)?sensor\.plc_/, ""));
        sim.appendChild(lbl);
      }
      el.hass = { ...hass, states: { ...states } };
    })();
  </script>
</body>
</html>
