          - { type: value, style: tile, x: 38, y: 986, width: 137, height: 88, label: Exhaust temp, entity: sensor.al1590_er_volvo_exhaust_temperature, value_size: 22, colors: [{ above: 89, color: red }, { above: 59, color: amber }, { color: green }] }
          - { type: value, style: tile, x: 187, y: 986, width: 137, height: 88, label: PropSft temp, entity: sensor.al1590_er_prop_shaft_grease_temperature, value_size: 22, colors: [{ above: 80, color: red }, { above: 50, color: amber }, { color: green }] }
