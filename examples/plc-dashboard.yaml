# Besturingspagina's TC90 JOAL, in het ontwerp "TC90 JOAL Bediening" (design system op claude.ai).
# Maak een dashboard aan (de URL maakt niet uit) en plak dit in de Raw configuration editor.
# Tab-paden zonder "/" (bijv. "sys-diesel") verwijzen naar een view van hetzelfde dashboard.
# Entiteiten komen uit examples/plc-entiteiten.csv; de overgebleven *.plc_… zijn nog niet gevonden in HA.
# Elke pagina: bovenaan de statusbalk (met de keuze tussen de subpagina's van een bestemming) en onderin
# de icoonbalk met acht bestemmingen (&tc_nav, in de eerste view); beide staan vast op het scherm. Actieve alarmen: het
# getal op Alarmen in de icoonbalk. Thema Nacht / Dag / Rood nacht met de knop rechtsboven.
# PLC lifebeat in de statusbalk: binary_sensor.wago_hcs_controls_wago_hcs_controls_lifebeat (interne communicatie PLC's).
# Elke view is één kaart van 1280 breed die meeschaalt met de schermbreedte; de eerste 56 px en de
# laatste 96 px zijn vrij voor de statusbalk en de icoonbalk.
title: PLC
views:
  # ===== Startpagina: Schip – Dek en interieur =====
  # De eerste view is de pagina die het dashboard opent. Hier staan ook de gedeelde lijsten
  # (&tc_status, &tc_nav, &ship_tabs), want een anker moet vóór zijn gebruik staan.

  - title: Dek en interieur
    path: ship-deck
    panel: true
    cards:
      - type: custom:shipborn-panel-card
        design: tc90
        kiosk: true            # HA-balken verbergen; even op de boven- of linkerrand blijven = tonen
        width: 1280
        height: 1000
        items:
          - type: statusbar
            title: Schip
            tabs: &ship_tabs
              - { label: Dek en interieur, path: ship-deck }
              - { label: Zijaanzicht, path: ship-side }
            status: &tc_status
              - { icon: lifebeat, label: PLC lifebeat, entity: binary_sensor.wago_hcs_controls_wago_hcs_controls_lifebeat }
              - { icon: walstroom, label: Walstroom, entity: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_on, tone: accent }
              - { icon: accu, label: Accu, entity: sensor.wago_energy_controls_wago_energy_controls_bms_state_of_charge, value: true, unit: "%", warn_below: 30, alarm_below: 15 }
          - type: navbar
            items: &tc_nav
              - { icon: schip, label: Schip, path: ship-deck, match: [ship-side] }
              - { icon: energie, label: Energie, path: energie, match: [sys-power, sys-dcbus] }
              - { icon: motor, label: Voortstuwing, path: voortstuwing, match: [sys-diesel, sys-generator, sys-bowthruster, sys-fuel] }
              - { icon: water, label: Water, path: sys-seawater, match: [sys-freshwater, sys-wastewater] }
              - { icon: klimaat, label: Klimaat, path: sys-webasto, match: [klimaat-instellingen, klimaat-browser] }
              - { icon: bilge, label: Bilge, path: sys-bilge }
              - { icon: alarm, label: Alarmen, path: alarms, badge_entity: sensor.er_alarm_status_active_alarms, badge_attribute: alarms }

          # ---- dekplan (tekening uit de map "TC90 JOAL", transparant) boven, interieur eronder ----
