          - { type: engine, x: 746, y: 353, width: 105, height: 70, active_entity: sensor.engine_room_main_engine_me_rpm, active_above: 100 }
          - { type: text, x: 752, y: 425, text: Volvo D6 340, font_size: 15, uppercase: true, color: "#a3a29c" }
          - { type: text, x: 752, y: 448, entity: sensor.engine_room_main_engine_me_rpm, mono: true, font_size: 14 }
          - { type: text, x: 849, y: 448, entity: sensor.engine_room_main_engine_me_coolant_temp, mono: true, font_size: 14, unit: "°C" }
          - { type: pipe, medium: seawater, points: [[1070, 675], [1070, 632]], thickness: 7, arrow: true, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 100 }
          - { type: strainer, x: 1045, y: 437, width: 50, height: 150, color: "#3cc7d6", active_entity: sensor.engine_room_main_engine_me_rpm, active_above: 100 }
          - { type: butterfly_valve, x: 1055, y: 585, active_entity: valve.er_ventielblok_1tm4_l4 }
          - { type: text, x: 1086, y: 595, text: Inlet V1, font_size: 12, uppercase: true, color: "#a3a29c" }
          - { type: pipe, medium: seawater, points: [[1044, 453], [947, 453]], thickness: 7, arrow: true, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 1 }
          - { type: text, x: 964, y: 421, entity: sensor.al1590_er_volvo_seawater_cooling_flow, mono: true, font_size: 16, unit: L/min, decimals: 1 }
          - { type: pipe, medium: seawater, points: [[503, 574], [503, 611]], thickness: 7, arrow: true, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 100 }
          - { type: butterfly_valve, x: 488, y: 620, active_entity: valve.er_ventielblok_1tm4_l3 }
          - { type: text, x: 520, y: 616, text: Outlet V2, font_size: 12, uppercase: true, color: "#a3a29c" }
          - { type: pipe, medium: seawater, points: [[503, 665], [503, 699]], thickness: 7, arrow: true, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 100 }
          - { type: pipe, medium: exhaust, points: [[755, 474], [755, 503], [536, 503]], thickness: 12, arrow: true, speed: 70, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 100 }
