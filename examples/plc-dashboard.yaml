          - { type: text, x: 230, y: 450, text: Seal grease, font_size: 14, uppercase: true, color: "var(--ink-muted, #a3a29c)" }
          - { type: pipe, medium: grease, points: [[221, 515], [221, 442]], thickness: 5, arrow: true, idle_opacity: 0.8 }
          - { type: text, x: 230, y: 470, entity: sensor.al1590_er_prop_shaft_grease_pressure, mono: true, font_size: 16, unit: bar, decimals: 2 }
          - { type: text, x: 230, y: 496, entity: sensor.al1590_er_prop_shaft_grease_temperature, mono: true, font_size: 16, unit: "°C", decimals: 1 }
          - { type: pipe, medium: seawater, points: [[529, 359], [529, 339]], thickness: 7, arrow: true, flow_entity: switch.er_zeewaterpomp_cooling }
          - { type: strainer, x: 502, y: 146, width: 50, height: 150, color: "#3cc7d6", active_entity: switch.er_zeewaterpomp_cooling }
          - { type: butterfly_valve, x: 514, y: 292, active_entity: valve.er_ventielblok_1tm4_l2 }
