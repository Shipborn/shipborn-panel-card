          - { type: text, x: 752, y: 494, entity: sensor.engine_room_main_engine_me_rpm, mono: true, font_size: 14 }
          - { type: text, x: 849, y: 494, entity: sensor.engine_room_main_engine_me_coolant_temp, mono: true, font_size: 14, unit: "°C" }
          - { type: pipe, medium: seawater, points: [[1070, 721], [1070, 678]], thickness: 7, arrow: true, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 100 }
          - { type: strainer, x: 1045, y: 483, width: 50, height: 150, color: "#3cc7d6", active_entity: sensor.engine_room_main_engine_me_rpm, active_above: 100 }
          - { type: butterfly_valve, x: 1055, y: 631, active_entity: valve.er_ventielblok_1tm4_l4 }
          - { type: text, x: 1086, y: 641, text: Inlet V1, font_size: 12, uppercase: true, color: "#a3a29c" }
          - { type: pipe, medium: seawater, points: [[1044, 499], [947, 499]], thickness: 7, arrow: true, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 1 }
