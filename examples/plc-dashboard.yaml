              - { label: Zeewater, path: sys-seawater }
              - { label: Zoetwater, path: sys-freshwater }
              - { label: Vuilwater, path: sys-wastewater }
              - { label: Bilge, path: sys-bilge }
              - { label: Accu's, path: sys-power }
              - { label: Webasto, path: sys-webasto }
              - { label: Navigatie, path: sys-navlights }
              - { label: Alarms, path: alarms }
