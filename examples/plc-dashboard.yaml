            }
          - { type: pipe, medium: exhaust, points: [[337, 619], [110, 619]], thickness: 12, speed: 70, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 100 }
          - { type: smoke, x: 41, y: 597, width: 70, height: 40, active_entity: sensor.engine_room_main_engine_me_rpm, active_above: 100 }
          - { type: pipe, medium: seawater, points: [[368, 667], [368, 702]], thickness: 6, arrow: true, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 1 }
          - { type: outlet, x: 233, y: 666, width: 80, height: 26, color: "#3cc7d6", label: Main outlet, active_entity: [sensor.engine_room_main_engine_me_rpm, switch.er_zeewaterpomp_cooling], active_above: 100 }
          - { type: text, x: 849, y: 582, width: 130, height: 65, text: Compressor, boxed: true, font_size: 15, active_entity: switch.0x781c9dfffea18853 }
          - { type: text, x: 889, y: 625, entity: sensor.al1590_er_compressor_manifold_pressure, mono: true, font_size: 14, unit: bar, decimals: 2 }
          - { type: pipe, medium: air, points: [[848, 638], [792, 638], [522, 638]], thickness: 4, arrow: true, flow_entity: valve.er_ventielblok_1tm4_l2 }
          - { type: pipe, medium: air, points: [[978, 600], [1005, 600], [1050, 600]], thickness: 4, arrow: true, flow_entity: valve.er_ventielblok_1tm4_l4 }

          # ---- bediening (uit het oude dashboard) ----
          - { type: panel, x: 20, y: 734, width: 620, height: 360, title: "Sensoren – bij Volvo aan alles groen" }
          - { type: value, style: tile, x: 38, y: 786, width: 137, height: 88, label: Engine speed, entity: sensor.engine_room_main_engine_me_rpm, value_size: 22, decimals: 0, colors: [{ above: 6000, color: red }, { above: 4000, color: amber }, { color: green }] }
