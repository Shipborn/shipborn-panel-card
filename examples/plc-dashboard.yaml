            x: 240
            y: 14
            font_size: 12
            tab_padding: 8
            letter_spacing: 0
            tabs: &sys_tabs
              - { label: Diesel, path: sys-diesel }
              - { label: Fuel, path: sys-fuel }
              - { label: Generator, path: sys-generator }
              - { label: DC-bus, path: sys-dcbus }
              - { label: Bow thruster, path: sys-bowthruster }
              - { label: Zeewater, path: sys-seawater }
              - { label: Zoetwater, path: sys-freshwater }
              - { label: Vuilwater, path: sys-wastewater }
              - { label: Bilge, path: sys-bilge }
              - { label: Accu's, path: sys-power }
              - { label: Webasto, path: sys-webasto }
              - { label: Navigatie, path: sys-navlights }
              - { label: Alarms, path: alarms }
          - { type: indicator, x: 1144, y: 25, entity: binary_sensor.plc_lifebeat, label: "PLC LIFEBEAT", font_size: 13, led_size: 10 }
          - { type: alarm, x: 0, y: 64, width: 1280, height: 40, entity: sensor.er_alarm_status_active_alarms, attribute: alarms, tap_action: { action: navigate, navigation_path: alarms } }
          - { type: hull, x: 20, y: 112, width: 1240, height: 600 }
          - { type: pipe, medium: air, points: [[847, 609], [605, 609], [605, 309], [545, 309]], thickness: 4, arrow: true, flow_entity: valve.er_ventielblok_1tm4_l3 }
          - { type: pipe, medium: shaft, points: [[630, 420], [134, 420]], thickness: 10, speed: 60, flow_entity: sensor.wago_hcs_controls_wago_hcs_controls_shaft_speed, flow_above: 5, flow_abs: true }
          - { type: propeller, x: 97, y: 333, width: 40, height: 170, active_entity: sensor.wago_hcs_controls_wago_hcs_controls_shaft_speed, active_above: 5, active_abs: true }
          - { type: text, x: 230, y: 450, text: Seal grease, font_size: 14, uppercase: true, color: "#a3a29c" }
          - { type: pipe, medium: grease, points: [[221, 515], [221, 442]], thickness: 5, arrow: true, idle_opacity: 0.8 }
          - { type: text, x: 230, y: 470, entity: sensor.al1590_er_prop_shaft_grease_pressure, mono: true, font_size: 16, unit: bar, decimals: 2 }
          - { type: text, x: 230, y: 496, entity: sensor.al1590_er_prop_shaft_grease_temperature, mono: true, font_size: 16, unit: "°C", decimals: 1 }
          - { type: pipe, medium: seawater, points: [[529, 359], [529, 339]], thickness: 7, arrow: true, flow_entity: switch.er_zeewaterpomp_cooling }
          - { type: strainer, x: 502, y: 146, width: 50, height: 150, color: "#3cc7d6", active_entity: switch.er_zeewaterpomp_cooling }
          - { type: butterfly_valve, x: 514, y: 292, active_entity: valve.er_ventielblok_1tm4_l2 }
          - { type: text, x: 460, y: 302, text: Inlet V3, font_size: 12, uppercase: true, color: "#a3a29c" }
          - { type: pipe, medium: seawater, points: [[452, 496], [496, 496]], thickness: 7, arrow: true, flow_entity: switch.er_zeewaterpomp_cooling }
          - {
              type: text,
              x: 435,
              y: 229,
              width: 70,
              height: 55,
              text: Cooling

                Electric/Shaft

                Gearbox,
              font_size: 13,
              active_entity: switch.er_zeewaterpomp_cooling
            }
          - { type: pipe, medium: seawater, points: [[555, 189], [650, 189], [650, 239]], thickness: 7, arrow: true, flow_entity: switch.er_zeewaterpomp_cooling }
          - { type: pipe, medium: seawater, points: [[625, 385], [190, 385], [190, 405]], thickness: 7, arrow: true, flow_entity: switch.er_zeewaterpomp_cooling }
          - {
              type: text,
              x: 629,
              y: 250,
              width: 70,
              height: 190,
              text: Gear

