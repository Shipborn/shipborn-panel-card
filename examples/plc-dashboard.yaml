# Besturingspagina's TC90 JOAL, in het ontwerp "TC90 JOAL Bediening" (design system op claude.ai).
# Maak een dashboard aan (de URL maakt niet uit) en plak dit in de Raw configuration editor.
# Tab-paden zonder "/" (bijv. "sys-diesel") verwijzen naar een view van hetzelfde dashboard.
# Entiteiten komen uit examples/plc-entiteiten.csv; de overgebleven *.plc_… zijn nog niet gevonden in HA.
# Elke pagina: bovenaan de statusbalk (met de keuze tussen de subpagina's van een bestemming) en onderin
# de icoonbalk met acht bestemmingen (&tc_nav); beide staan vast op het scherm. Actieve alarmen: het
# getal op Alarmen in de icoonbalk. Thema Nacht / Dag / Rood nacht met de knop rechtsboven.
# In de statusbalk staat nog binary_sensor.plc_lifebeat (niet gevonden in HA).
# Elke view is één kaart van 1280 breed die meeschaalt met de schermbreedte; de eerste 56 px en de
# laatste 96 px zijn vrij voor de statusbalk en de icoonbalk.
title: PLC
views:
  # ===== Systemschema's (omgezet uit Overszichtstekeningen/*.jpg) =====
  # Leidingen stromen (bewegende streepjes) zodra hun flow_entity actief is.
  # Bestemmingen: Voortstuwing (Overzicht, Diesel, Generator, Boegschroef, Brandstof), Energie (Accu's,
  # DC-bus), Water (Zeewater, Zoetwater, Vuilwater), Schip (Zijaanzicht, Dekplan, Interieur), Klimaat,
  # Verlichting, Bilge en Alarmen.

  - title: Diesel engine
    path: sys-diesel
    panel: true
    # Nog te koppelen (niet gevonden in HA):
    #   binary_sensor.plc_diesel_alarm
    cards:
      - type: custom:shipborn-panel-card
        design: tc90
        kiosk: true            # HA-balken verbergen; even op de boven- of linkerrand blijven = tonen
        width: 1280
        height: 1556
        items:
          - type: statusbar
            title: Voortstuwing
            tabs: &voort_tabs
              - { label: Overzicht, path: voortstuwing }
              - { label: Diesel, path: sys-diesel }
              - { label: Generator, path: sys-generator }
              - { label: Boegschroef, path: sys-bowthruster }
              - { label: Brandstof, path: sys-fuel }
            status: &tc_status
              - { icon: lifebeat, label: PLC lifebeat, entity: binary_sensor.plc_lifebeat }
              - { icon: walstroom, label: Walstroom, entity: binary_sensor.wago_energy_controls_wago_energy_controls_shore_supply_is_on, tone: accent }
              - { icon: accu, label: Accu, entity: sensor.wago_energy_controls_wago_energy_controls_bms_state_of_charge, value: true, unit: "%", warn_below: 30, alarm_below: 15 }
          - type: navbar
