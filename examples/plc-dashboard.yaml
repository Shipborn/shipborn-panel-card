          - { type: text, x: 849, y: 628, width: 130, height: 65, text: Compressor, boxed: true, font_size: 15, active_entity: switch.0x781c9dfffea18853 }
          - { type: text, x: 889, y: 671, entity: sensor.al1590_er_compressor_manifold_pressure, mono: true, font_size: 14, unit: bar, decimals: 2 }
          - { type: pipe, medium: air, points: [[848, 684], [792, 684], [522, 684]], thickness: 4, arrow: true, flow_entity: valve.er_ventielblok_1tm4_l2 }
          - { type: pipe, medium: air, points: [[978, 646], [1005, 646], [1050, 646]], thickness: 4, arrow: true, flow_entity: valve.er_ventielblok_1tm4_l4 }

