              font_size: 15,
              boxed: true,
              active_entity: sensor.wago_hcs_controls_wago_hcs_controls_shaft_speed,
              active_above: 5,
              active_abs: true
            }
          - { type: pipe, medium: shaft, points: [[736, 390], [700, 390]], thickness: 20, flow_entity: sensor.engine_room_main_engine_me_rpm, flow_above: 100 }
