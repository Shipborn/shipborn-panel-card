          - { type: text, x: 460, y: 348, text: Inlet V3, font_size: 12, uppercase: true, color: "#a3a29c" }
          - { type: pipe, medium: seawater, points: [[452, 542], [496, 542]], thickness: 7, arrow: true, flow_entity: switch.er_zeewaterpomp_cooling }
          - {
              type: text,
              x: 435,
              y: 275,
              width: 70,
              height: 55,
