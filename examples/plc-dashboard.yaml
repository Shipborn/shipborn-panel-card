# PLC-besturingspagina's (ontwerp "PLC-pagina's" op de canvas).
# Maak een dashboard aan (de URL maakt niet uit) en plak dit in de Raw configuration editor.
# Tab-paden zonder "/" (bijv. "sys-diesel") verwijzen naar een view van hetzelfde dashboard.
# Entiteiten komen uit examples/plc-entiteiten.csv; de overgebleven *.plc_… zijn nog niet gevonden in HA.
# Elke view is één kaart van 1280×800 die meeschaalt met de schermbreedte.
title: PLC
views:
  # ===== Systemschema's (omgezet uit Overszichtstekeningen/*.jpg) =====
  # Leidingen stromen (bewegende streepjes) zodra hun flow_entity actief is.
  # De tabs bovenin wisselen tussen deze pagina's.

  - title: Diesel engine
    path: sys-diesel
    panel: true
    # Nog te koppelen (niet gevonden in HA):
    #   binary_sensor.plc_diesel_alarm
    cards:
      - type: custom:shipborn-panel-card
        kiosk: true            # HA-balken verbergen; even op de boven- of linkerrand blijven = tonen
        width: 1280
        height: 1460
        background: "#0d0e10"
        border: "#0d0e10"
        corner_radius: 0
        items:
