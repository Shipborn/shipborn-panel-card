          - { type: text, x: 230, y: 496, text: Seal grease, font_size: 14, uppercase: true, color: "#a3a29c" }
          - { type: pipe, medium: grease, points: [[221, 561], [221, 488]], thickness: 5, arrow: true, idle_opacity: 0.8 }
          - { type: text, x: 230, y: 516, entity: sensor.al1590_er_prop_shaft_grease_pressure, mono: true, font_size: 16, unit: bar, decimals: 2 }
          - { type: text, x: 230, y: 542, entity: sensor.al1590_er_prop_shaft_grease_temperature, mono: true, font_size: 16, unit: "°C", decimals: 1 }
          - { type: pipe, medium: seawater, points: [[529, 405], [529, 385]], thickness: 7, arrow: true, flow_entity: switch.er_zeewaterpomp_cooling }
          - { type: strainer, x: 502, y: 192, width: 50, height: 150, color: "#3cc7d6", active_entity: switch.er_zeewaterpomp_cooling }
