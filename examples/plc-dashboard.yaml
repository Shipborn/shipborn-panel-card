              - { icon: energie, label: Energie, path: sys-power, match: [sys-dcbus] }
              - { icon: motor, label: Voortstuwing, path: voortstuwing, match: [sys-diesel, sys-generator, sys-bowthruster, sys-fuel] }
              - { icon: water, label: Water, path: sys-seawater, match: [sys-freshwater, sys-wastewater] }
              - { icon: klimaat, label: Klimaat, path: sys-webasto }
              - { icon: verlichting, label: Verlichting, path: sys-navlights }
              - { icon: bilge, label: Bilge, path: sys-bilge }
              - { icon: alarm, label: Alarmen, path: alarms, badge_entity: sensor.er_alarm_status_active_alarms, badge_attribute: alarms }
          - { type: hull, x: 20, y: 112, width: 1240, height: 600 }
          - { type: pipe, medium: air, points: [[847, 609], [605, 609], [605, 309], [545, 309]], thickness: 4, arrow: true, flow_entity: valve.er_ventielblok_1tm4_l3 }
