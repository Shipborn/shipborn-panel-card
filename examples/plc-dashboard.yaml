          - { type: alarm, x: 0, y: 64, width: 1280, height: 40, entity: sensor.plc_active_alarm, active_entity: binary_sensor.plc_alarm_active }
          - { type: hull, x: 20, y: 158, width: 1240, height: 600 }
          - { type: pipe, medium: air, points: [[847, 655], [605, 655], [605, 355], [545, 355]], thickness: 4, arrow: true, flow_entity: valve.er_ventielblok_1tm4_l3 }
